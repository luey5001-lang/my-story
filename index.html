<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🧱 알카노이드 - Arkanoid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Arial', sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    .game-wrapper {
      background: #1a1a2e;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 0 60px rgba(100, 100, 255, 0.2), 0 0 120px rgba(0, 0, 0, 0.8);
      border: 2px solid #334;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    canvas {
      display: block;
      border-radius: 10px;
      cursor: none;
      background: #0d0d1a;
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
    }
    .info-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
      margin-bottom: 12px;
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      gap: 20px;
    }
    .info-item {
      background: #222240;
      padding: 10px 20px;
      border-radius: 30px;
      border: 1px solid #446;
      text-align: center;
      flex: 1;
    }
    .info-label {
      font-size: 0.7rem;
      color: #88a;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .info-value {
      font-size: 1.3rem;
      color: #fff;
    }
    button {
      background: #335;
      color: #fff;
      border: 1px solid #557;
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      letter-spacing: 1px;
      margin-top: 10px;
    }
    button:hover {
      background: #446;
      box-shadow: 0 0 20px rgba(100, 100, 255, 0.3);
    }
    #message {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      font-weight: bold;
      color: #fff;
      text-shadow: 0 0 30px #ff0, 0 0 60px #f80;
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .controls-hint {
      color: #556;
      font-size: 0.75rem;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <div class="info-bar">
      <div class="info-item">
        <div class="info-label">점수</div>
        <div class="info-value" id="score">0</div>
      </div>
      <div class="info-item">
        <div class="info-label">목숨</div>
        <div class="info-value" id="lives">❤️❤️❤️</div>
      </div>
      <div class="info-item">
        <div class="info-label">레벨</div>
        <div class="info-value" id="level">1</div>
      </div>
      <div class="info-item">
        <div class="info-label">파워</div>
        <div class="info-value" id="power">-</div>
      </div>
    </div>
    <canvas id="game" width="600" height="500"></canvas>
    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
      <button id="restartBtn">🔄 새 게임</button>
      <button id="pauseBtn">⏯️ 일시정지</button>
    </div>
    <div class="controls-hint">🖱️ 마우스 이동 / ← → 키보드 | 📱 터치 드래그 | 스페이스바: 공 발사</div>
  </div>
  <div id="message"></div>

  <script>
    (() => {
      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');

      const W = canvas.width;
      const H = canvas.height;

      // ==================== 게임 상태 ====================
      let score = 0;
      let lives = 3;
      let level = 1;
      let paused = false;
      let gameStarted = false;
      let gameOver = false;
      let victory = false;

      // ==================== 패들 ====================
      const paddle = {
        w: 100,
        h: 14,
        x: W / 2 - 50,
        y: H - 40,
        speed: 8,
        sticky: false,
        wide: false,
        wideTimer: 0,
      };

      // ==================== 공 ====================
      let balls = [];
      const defaultBall = {
        x: W / 2,
        y: H - 55,
        r: 7,
        dx: 4,
        dy: -4,
        speed: 6,
        attached: true,
        fire: false,
      };

      function createBall(attached = true) {
        return {
          x: paddle.x + paddle.w / 2,
          y: paddle.y - 8,
          r: 7,
          dx: (Math.random() - 0.5) * 3 + 2,
          dy: -5,
          speed: 6,
          attached: attached,
          fire: false,
        };
      }

      // ==================== 벽돌 ====================
      let bricks = [];
      const BRICK_ROWS = 8;
      const BRICK_COLS = 12;
      const BRICK_W = 46;
      const BRICK_H = 18;
      const BRICK_PAD = 3;
      const BRICK_TOP = 50;
      const BRICK_LEFT = (W - (BRICK_COLS * (BRICK_W + BRICK_PAD))) / 2;

      const BRICK_COLORS = ['#ff4466', '#ff6644', '#ff8844', '#ffaa44', '#ffcc44', '#ffdd44', '#44dd44', '#44aadd'];

      function createBricks() {
        bricks = [];
        for (let row = 0; row < BRICK_ROWS; row++) {
          for (let col = 0; col < BRICK_COLS; col++) {
            const isHard = row < 2;
            const isGold = Math.random() < 0.08;
            bricks.push({
              x: BRICK_LEFT + col * (BRICK_W + BRICK_PAD),
              y: BRICK_TOP + row * (BRICK_H + BRICK_PAD),
              w: BRICK_W,
              h: BRICK_H,
              alive: true,
              hp: isHard ? 2 : 1,
              color: BRICK_COLORS[row],
              isGold: isGold,
              row: row,
            });
          }
        }
      }

      // ==================== 파워업 ====================
      let powerUps = [];
      const POWER_TYPES = ['wide', 'sticky', 'multiball', 'slow', 'fire', 'extralife'];

      function spawnPowerUp(x, y) {
        if (Math.random() < 0.25) {
          const type = POWER_TYPES[Math.floor(Math.random() * POWER_TYPES.length)];
          powerUps.push({
            x: x,
            y: y,
            w: 20,
            h: 20,
            dy: 2.5,
            type: type,
            alive: true,
          });
        }
      }

      function applyPowerUp(type) {
        const powerEl = document.getElementById('power');
        switch (type) {
          case 'wide':
            paddle.wide = true;
            paddle.wideTimer = 400;
            paddle.w = 160;
            powerEl.textContent = 'WIDE';
            break;
          case 'sticky':
            paddle.sticky = true;
            setTimeout(() => {
              paddle.sticky = false;
              powerEl.textContent = '-';
            }, 8000);
            powerEl.textContent = 'STICKY';
            break;
          case 'multiball':
            const newBalls = [];
            for (const b of balls) {
              if (!b.attached) {
                for (let i = 0; i < 2; i++) {
                  newBalls.push({
                    x: b.x,
                    y: b.y,
                    r: 7,
                    dx: (Math.random() - 0.5) * 6,
                    dy: -5 - Math.random() * 3,
                    speed: 6,
                    attached: false,
                    fire: b.fire,
                  });
                }
              }
            }
            balls.push(...newBalls);
            powerEl.textContent = 'MULTI';
            break;
          case 'slow':
            for (const b of balls) {
              b.speed = Math.max(2, b.speed - 2);
              const angle = Math.atan2(b.dy, b.dx);
              b.dx = Math.cos(angle) * b.speed;
              b.dy = Math.sin(angle) * b.speed;
            }
            powerEl.textContent = 'SLOW';
            break;
          case 'fire':
            for (const b of balls) {
              b.fire = true;
            }
            powerEl.textContent = 'FIRE';
            break;
          case 'extralife':
            lives = Math.min(5, lives + 1);
            updateLivesDisplay();
            powerEl.textContent = '1UP';
            break;
        }
      }

      // ==================== 파티클 ====================
      let particles = [];

      function spawnParticles(x, y, color, count = 15) {
        for (let i = 0; i < count; i++) {
          particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6 - 2,
            life: 25 + Math.random() * 20,
            maxLife: 45,
            color: color,
            size: 2 + Math.random() * 3,
          });
        }
      }

      // ==================== 입력 ====================
      let mouseX = W / 2;
      let keys = {};

      canvas.addEventListener('mousemove', e => {
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        mouseX = (e.clientX - rect.left) * scaleX;
        updatePaddlePosition();
      });

      canvas.addEventListener('touchmove', e => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        mouseX = (e.touches[0].clientX - rect.left) * scaleX;
        updatePaddlePosition();
      }, { passive: false });

      canvas.addEventListener('touchstart', e => {
        e.preventDefault();
        if (!gameStarted) {
          launchBall();
        }
        const rect = canvas.getBoundingClientRect();
        const scaleX = W / rect.width;
        mouseX = (e.touches[0].clientX - rect.left) * scaleX;
        updatePaddlePosition();
      });

      window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (e.code === 'Space') {
          e.preventDefault();
          if (!gameStarted) launchBall();
          else if (paddle.sticky) releaseStickyBalls();
        }
        if (e.code === 'KeyP') togglePause();
        if (e.code === 'KeyR') resetGame();
      });

      window.addEventListener('keyup', e => {
        keys[e.code] = false;
      });

      function updatePaddlePosition() {
        if (gameOver || victory || paused) return;
        const newX = Math.max(0, Math.min(W - paddle.w, mouseX - paddle.w / 2));
        const dx = newX - paddle.x;
        paddle.x = newX;

        // 패들에 붙은 공 이동
        for (const b of balls) {
          if (b.attached) {
            b.x += dx;
          }
        }
      }

      // ==================== 게임 로직 ====================
      function launchBall() {
        if (gameOver || victory) return;
        gameStarted = true;
        for (const b of balls) {
          if (b.attached) {
            b.attached = false;
            const angle = (Math.random() - 0.5) * 0.8 - Math.PI / 2;
            b.dx = Math.cos(angle) * b.speed;
            b.dy = Math.sin(angle) * b.speed;
          }
        }
      }

      function releaseStickyBalls() {
        for (const b of balls) {
          if (b.attached) {
            b.attached = false;
            b.dx = (Math.random() - 0.5) * 4;
            b.dy = -b.speed;
          }
        }
      }

      function togglePause() {
        paused = !paused;
        document.getElementById('pauseBtn').textContent = paused ? '▶️ 재개' : '⏯️ 일시정지';
      }

      function loseLife() {
        lives--;
        updateLivesDisplay();
        balls = [createBall(true)];
        gameStarted = false;
        paddle.sticky = false;
        paddle.wide = false;
        paddle.w = 100;
        document.getElementById('power').textContent = '-';
        powerUps = [];

        if (lives <= 0) {
          gameOver = true;
          showMessage('GAME OVER', 2000);
        }
      }

      function nextLevel() {
        level++;
        document.getElementById('level').textContent = level;
        createBricks();
        balls = [createBall(true)];
        gameStarted = false;
        paddle.sticky = false;
        paddle.wide = false;
        paddle.w = 100;
        document.getElementById('power').textContent = '-';
        powerUps = [];
        particles = [];
        // 속도 증가
        for (const b of balls) {
          b.speed = Math.min(10, 6 + level * 0.5);
        }
        showMessage(`LEVEL ${level}!`, 1500);
      }

      function resetGame() {
        score = 0;
        lives = 3;
        level = 1;
        gameOver = false;
        victory = false;
        gameStarted = false;
        paused = false;
        balls = [createBall(true)];
        paddle.x = W / 2 - 50;
        paddle.y = H - 40;
        paddle.w = 100;
        paddle.sticky = false;
        paddle.wide = false;
        paddle.wideTimer = 0;
        powerUps = [];
        particles = [];
        document.getElementById('score').textContent = '0';
        document.getElementById('level').textContent = '1';
        document.getElementById('power').textContent = '-';
        document.getElementById('pauseBtn').textContent = '⏯️ 일시정지';
        updateLivesDisplay();
        createBricks();
      }

      function updateLivesDisplay() {
        document.getElementById('lives').textContent = '❤️'.repeat(Math.max(0, lives));
      }

      function showMessage(text, duration) {
        const msg = document.getElementById('message');
        msg.textContent = text;
        msg.style.opacity = '1';
        setTimeout(() => { msg.style.opacity = '0'; }, duration);
      }

      // ==================== 충돌 감지 ====================
      function ballBrickCollision(ball, brick) {
        return (
          ball.x + ball.r > brick.x &&
          ball.x - ball.r < brick.x + brick.w &&
          ball.y + ball.r > brick.y &&
          ball.y - ball.r < brick.y + brick.h
        );
      }

      function ballPaddleCollision(ball) {
        if (ball.attached) return false;
        return (
          ball.y + ball.r >= paddle.y &&
          ball.y - ball.r <= paddle.y + paddle.h &&
          ball.x + ball.r >= paddle.x &&
          ball.x - ball.r <= paddle.x + paddle.w
        );
      }

      // ==================== 업데이트 ====================
      function update() {
        if (paused || gameOver || victory) return;

        // 키보드 이동
        if (keys['ArrowLeft'] || keys['KeyA']) {
          paddle.x = Math.max(0, paddle.x - paddle.speed);
          for (const b of balls) {
            if (b.attached) b.x = paddle.x + paddle.w / 2;
          }
        }
        if (keys['ArrowRight'] || keys['KeyD']) {
          paddle.x = Math.min(W - paddle.w, paddle.x + paddle.speed);
          for (const b of balls) {
            if (b.attached) b.x = paddle.x + paddle.w / 2;
          }
        }

        // 와이드 타이머
        if (paddle.wide) {
          paddle.wideTimer--;
          if (paddle.wideTimer <= 0) {
            paddle.wide = false;
            paddle.w = 100;
            document.getElementById('power').textContent = '-';
          }
        }

        // 공 업데이트
        for (let i = balls.length - 1; i >= 0; i--) {
          const b = balls[i];
          if (b.attached) {
            b.x = paddle.x + paddle.w / 2;
            b.y = paddle.y - b.r;
            continue;
          }

          b.x += b.dx;
          b.y += b.dy;

          // 벽 충돌
          if (b.x - b.r <= 0) {
            b.x = b.r;
            b.dx = Math.abs(b.dx);
          }
          if (b.x + b.r >= W) {
            b.x = W - b.r;
            b.dx = -Math.abs(b.dx);
          }
          if (b.y - b.r <= 0) {
            b.y = b.r;
            b.dy = Math.abs(b.dy);
          }

          // 바닥
          if (b.y - b.r > H + 20) {
            balls.splice(i, 1);
            if (balls.length === 0) {
              loseLife();
            }
            continue;
          }

          // 패들 충돌
          if (ballPaddleCollision(b)) {
            b.y = paddle.y - b.r;
            const hitPos = (b.x - paddle.x) / paddle.w;
            const angle = (hitPos - 0.5) * Math.PI * 0.7;
            b.dx = Math.sin(angle) * b.speed;
            b.dy = -Math.cos(angle) * b.speed;

            if (paddle.sticky) {
              b.attached = true;
              b.dx = 0;
              b.dy = 0;
            }
          }

          // 벽돌 충돌
          for (const brick of bricks) {
            if (!brick.alive) continue;
            if (ballBrickCollision(b, brick)) {
              if (!b.fire) {
                // 일반 충돌
                const prevX = b.x - b.dx;
                const prevY = b.y - b.dy;
                if (prevX + b.r <= brick.x || prevX - b.r >= brick.x + brick.w) {
                  b.dx = -b.dx;
                } else {
                  b.dy = -b.dy;
                }
              }
              // 파이어볼은 그냥 통과

              brick.hp--;
              if (brick.hp <= 0) {
                brick.alive = false;
                score += brick.isGold ? 500 : (brick.row < 2 ? 100 : 50);
                document.getElementById('score').textContent = score;
                spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brick.color, 12);
                if (brick.isGold) {
                  spawnPowerUp(brick.x + brick.w / 2, brick.y + brick.h / 2);
                }
              }
              break;
            }
          }
        }

        // 파워업 업데이트
        for (let i = powerUps.length - 1; i >= 0; i--) {
          const pu = powerUps[i];
          pu.y += pu.dy;

          if (
            pu.y + pu.h >= paddle.y &&
            pu.y <= paddle.y + paddle.h &&
            pu.x + pu.w >= paddle.x &&
            pu.x <= paddle.x + paddle.w
          ) {
            applyPowerUp(pu.type);
            spawnParticles(pu.x, pu.y, '#fff', 8);
            powerUps.splice(i, 1);
            continue;
          }

          if (pu.y > H + 30) {
            powerUps.splice(i, 1);
          }
        }

        // 파티클 업데이트
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.1;
          p.life--;
          if (p.life <= 0) particles.splice(i, 1);
        }

        // 승리 체크
        if (bricks.every(b => !b.alive)) {
          if (level >= 5) {
            victory = true;
            showMessage('🏆 ALL CLEAR!', 3000);
          } else {
            nextLevel();
          }
        }
      }

      // ==================== 렌더링 ====================
      function draw() {
        ctx.clearRect(0, 0, W, H);

        // 배경
        const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0, '#0a0a20');
        bgGrad.addColorStop(1, '#1a1a3a');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // 별 배경
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 40; i++) {
          const sx = (i * 157 + 31) % W;
          const sy = (i * 211 + 67) % H;
          const brightness = 0.3 + (Math.sin(Date.now() * 0.001 + i) * 0.3);
          ctx.globalAlpha = brightness;
          ctx.fillRect(sx, sy, 1.5, 1.5);
        }
        ctx.globalAlpha = 1;

        // 벽돌
        for (const brick of bricks) {
          if (!brick.alive) continue;
          const grad = ctx.createLinearGradient(brick.x, brick.y, brick.x, brick.y + brick.h);
          grad.addColorStop(0, brick.color);
          grad.addColorStop(1, shadeColor(brick.color, -30));
          ctx.fillStyle = grad;
          ctx.fillRect(brick.x, brick.y, brick.w, brick.h);

          // 테두리
          ctx.strokeStyle = 'rgba(255,255,255,0.2)';
          ctx.lineWidth = 1;
          ctx.strokeRect(brick.x, brick.y, brick.w, brick.h);

          // 골드 벽돌
          if (brick.isGold) {
            ctx.fillStyle = '#ffd700';
            ctx.fillRect(brick.x + brick.w / 2 - 8, brick.y + brick.h / 2 - 6, 16, 12);
            ctx.fillStyle = '#fff';
            ctx.fillRect(brick.x + brick.w / 2 - 4, brick.y + brick.h / 2 - 8, 8, 4);
          }

          // 내구도 표시
          if (brick.hp > 1) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(brick.x + 4, brick.y + brick.h / 2 - 1, brick.w - 8, 2);
          }
        }

        // 파워업
        for (const pu of powerUps) {
          const colors = {
            wide: '#4af',
            sticky: '#4f4',
            multiball: '#f4f',
            slow: '#ff4',
            fire: '#f44',
            extralife: '#f8f',
          };
          ctx.fillStyle = colors[pu.type] || '#fff';
          ctx.beginPath();
          ctx.arc(pu.x, pu.y, pu.w / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 10px Arial';
          ctx.textAlign = 'center';
          ctx.fillText(pu.type[0].toUpperCase(), pu.x, pu.y + 4);
          ctx.textAlign = 'start';
        }

        // 파티클
        for (const p of particles) {
          ctx.globalAlpha = p.life / p.maxLife;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        }
        ctx.globalAlpha = 1;

        // 패들
        const paddleGrad = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.h);
        paddleGrad.addColorStop(0, '#eef');
        paddleGrad.addColorStop(1, '#aac');
        ctx.fillStyle = paddleGrad;
        ctx.beginPath();
        ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 7);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 공
        for (const b of balls) {
          // 불 공 이펙트
          if (b.fire) {
            const fireGrad = ctx.createRadialGradient(b.x, b.y, b.r * 0.3, b.x, b.y, b.r * 1.8);
            fireGrad.addColorStop(0, '#fff');
            fireGrad.addColorStop(0.3, '#ff0');
            fireGrad.addColorStop(0.7, '#f60');
            fireGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = fireGrad;
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.r * 1.8, 0, Math.PI * 2);
            ctx.fill();
          }

          const ballGrad = ctx.createRadialGradient(b.x - 2, b.y - 2, b.r * 0.1, b.x, b.y, b.r);
          ballGrad.addColorStop(0, '#fff');
          ballGrad.addColorStop(0.6, '#ddd');
          ballGrad.addColorStop(1, '#999');
          ctx.fillStyle = ballGrad;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }

        // 게임 시작 전 안내
        if (!gameStarted && !gameOver && !victory) {
          ctx.fillStyle = 'rgba(0,0,0,0.4)';
          ctx.fillRect(0, H / 2 - 30, W, 60);
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 20px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('스페이스바 또는 화면 터치로 시작', W / 2, H / 2 + 8);
          ctx.textAlign = 'start';
        }

        // 게임 오버 오버레이
        if (gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,0.7)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#f44';
          ctx.font = 'bold 42px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('GAME OVER', W / 2, H / 2 - 10);
          ctx.fillStyle = '#fff';
          ctx.font = '18px Arial';
          ctx.fillText(`최종 점수: ${score}`, W / 2, H / 2 + 30);
          ctx.textAlign = 'start';
        }

        if (victory) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = '#ff0';
          ctx.font = 'bold 42px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('🏆 ALL CLEAR! 🏆', W / 2, H / 2 - 10);
          ctx.fillStyle = '#fff';
          ctx.font = '18px Arial';
          ctx.fillText(`점수: ${score} | 레벨: ${level}`, W / 2, H / 2 + 30);
          ctx.textAlign = 'start';
        }
      }

      function shadeColor(hex, amt) {
        const n = parseInt(hex.slice(1), 16);
        const r = Math.max(0, Math.min(255, ((n >> 16) & 0xff) + amt));
        const g = Math.max(0, Math.min(255, ((n >> 8) & 0xff) + amt));
        const b = Math.max(0, Math.min(255, (n & 0xff) + amt));
        return `rgb(${r},${g},${b})`;
      }

      // ==================== 게임 루프 ====================
      function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
      }

      // ==================== 이벤트 ====================
      document.getElementById('restartBtn').addEventListener('click', resetGame);
      document.getElementById('pauseBtn').addEventListener('click', togglePause);

      // ==================== 초기화 ====================
      createBricks();
      balls = [createBall(true)];
      updateLivesDisplay();
      gameLoop();

      console.log('🧱 알카노이드 준비 완료!');
      console.log('🕹️ 마우스 이동 | 스페이스바 발사 | ← → 이동');
    })();
  </script>

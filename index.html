<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 스타 커맨더 - 3D 우주 슈팅 (수정판)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #gameCanvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #uiLayer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
    }
    .hud-panel {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 16px;
      padding: 16px 22px;
      color: #0ff;
      font-weight: bold;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.15);
    }
    .score-display {
      font-size: 2rem;
      text-shadow: 0 0 20px #0ff;
    }
    .health-bar {
      width: 200px;
      height: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid #0ff;
    }
    .health-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff0044, #ff4466);
      transition: width 0.3s;
      box-shadow: 0 0 15px #f44;
    }
    #crosshair {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      font-size: 2rem;
      transform: translate(-50%, -50%);
      text-shadow: 0 0 15px #0ff;
      display: none;
    }
    .controls-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      font-size: 0.85rem;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      background: rgba(0,0,0,0.5);
      padding: 8px 20px;
      border-radius: 20px;
    }
    #gameOverScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
      pointer-events: all;
    }
    #gameOverScreen.active { display: flex; }
    .gameover-box { text-align: center; color: white; }
    .gameover-box h1 {
      font-size: 4rem;
      color: #ff4444;
      text-shadow: 0 0 50px #f00;
      margin-bottom: 10px;
    }
    .restart-btn {
      background: #0ff;
      color: #000;
      border: none;
      padding: 16px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      pointer-events: all;
      transition: 0.2s;
    }
    .restart-btn:hover { background: #fff; box-shadow: 0 0 30px #0ff; }
  </style>
</head>
<body>
  <div id="crosshair">➕</div>
  <div id="uiLayer">
    <div class="hud-panel">
      <div class="score-display" id="scoreDisplay">0</div>
      <div style="color:#aaa; font-size:0.8rem;">KILLS</div>
      <div class="health-bar">
        <div class="health-fill" id="healthFill" style="width:100%"></div>
      </div>
    </div>
    <div class="hud-panel" style="text-align:right;">
      <div style="color:#ff0; font-size:1.2rem;">⭐ <span id="comboDisplay">x1</span></div>
      <div style="color:#aaa; font-size:0.7rem;">COMBO</div>
    </div>
  </div>
  <div id="gameOverScreen">
    <div class="gameover-box">
      <h1>💥 GAME OVER</h1>
      <p style="font-size:1.5rem; color:#0ff;">최종 점수: <span id="finalScore">0</span></p>
      <button class="restart-btn" id="restartButton">🚀 다시 출격</button>
    </div>
  </div>
  <div class="controls-hint" id="controlsHint">
    🖱️ 마우스 이동: 우주선 조종 | 🖱️ 클릭: 마우스 방향으로 레이저 발사<br>
    📱 터치: 드래그로 이동 + 자동 발사
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    class StarCommander {
      constructor() {
        this.score = 0;
        this.combo = 1;
        this.comboTimer = 0;
        this.health = 100;
        this.isGameOver = false;
        
        // 마우스/터치 위치 (화면 기준 -1~1)
        this.mouseX = 0;
        this.mouseY = 0;
        // 실제 마우스 클릭 위치 (3D 월드 좌표로 변환)
        this.targetDirection = new THREE.Vector3(0, 0, 1);
        
        this.isFiring = false;
        this.fireCooldown = 0;
        this.fireRate = 5; // 프레임 당 쿨다운
        
        // 오브젝트 풀
        this.bullets = [];
        this.enemies = [];
        this.particles = [];
        
        // Three.js 설정
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.5, 200);
        this.camera.position.set(0, 2, 28);
        this.camera.lookAt(0, -2, 0);
        
        this.renderer = new THREE.WebGLRenderer({ 
          antialias: true,
          powerPreference: "high-performance"
        });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.prepend(this.renderer.domElement);
        
        // 포스트 프로세싱
        this.composer = new EffectComposer(this.renderer);
        this.composer.addPass(new RenderPass(this.scene, this.camera));
        const bloomPass = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight), 
          1.2, 0.4, 0.85
        );
        this.composer.addPass(bloomPass);
        
        this.raycaster = new THREE.Raycaster();
        this.mouseVector = new THREE.Vector2();
        
        this.initScene();
        this.initPlayer();
        this.initLights();
        this.initAudio();
        this.bindEvents();
        this.animate();
      }
      
      initScene() {
        // 성운 배경
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 2500;
        const starsPos = new Float32Array(starsCount * 3);
        const starsColors = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
          starsPos[i*3] = (Math.random() - 0.5) * 140;
          starsPos[i*3+1] = (Math.random() - 0.5) * 90;
          starsPos[i*3+2] = -10 - Math.random() * 70;
          starsColors[i*3] = 0.5 + Math.random() * 0.5;
          starsColors[i*3+1] = 0.5 + Math.random() * 0.5;
          starsColors[i*3+2] = 0.8 + Math.random() * 0.2;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        starsGeo.setAttribute('color', new THREE.BufferAttribute(starsColors, 3));
        const starsMat = new THREE.PointsMaterial({ 
          size: 0.18, 
          vertexColors: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        this.starField = new THREE.Points(starsGeo, starsMat);
        this.scene.add(this.starField);
        
        // 행성
        const planetGeo = new THREE.SphereGeometry(9, 64, 64);
        const planetMat = new THREE.MeshStandardMaterial({
          color: 0x2244aa,
          roughness: 0.6,
          metalness: 0.3
        });
        this.planet = new THREE.Mesh(planetGeo, planetMat);
        this.planet.position.set(35, -30, -55);
        this.scene.add(this.planet);
        
        // 행성 고리
        const ringGeo = new THREE.TorusGeometry(13, 1.8, 16, 100);
        const ringMat = new THREE.MeshStandardMaterial({
          color: 0x88aaff,
          roughness: 0.4,
          metalness: 0.6,
          emissive: 0x224466
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 3;
        this.planet.add(ring);
        
        // 그리드 (공간감용)
        const gridHelper = new THREE.PolarGridHelper(40, 32, 24, 128, 0x334466, 0x223344);
        gridHelper.position.z = -10;
        this.scene.add(gridHelper);
      }
      
      initPlayer() {
        const shipGroup = new THREE.Group();
        
        // 동체
        const bodyGeo = new THREE.ConeGeometry(0.7, 3, 6, 1);
        const bodyMat = new THREE.MeshStandardMaterial({ 
          color: 0x4488cc, 
          roughness: 0.2, 
          metalness: 0.8,
          emissive: 0x112244
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.rotation.x = Math.PI / 2;
        shipGroup.add(body);
        
        // 날개
        const wingGeo = new THREE.BoxGeometry(2.6, 0.15, 0.9);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0x3366aa, roughness: 0.3, metalness: 0.7 });
        const wings = new THREE.Mesh(wingGeo, wingMat);
        wings.position.z = -0.4;
        shipGroup.add(wings);
        
        // 보조 날개
        const finGeo = new THREE.BoxGeometry(0.3, 0.8, 0.4);
        const finMat = new THREE.MeshStandardMaterial({ color: 0x2255aa, roughness: 0.3, metalness: 0.8 });
        const finLeft = new THREE.Mesh(finGeo, finMat);
        finLeft.position.set(-1.3, 0, -0.2);
        shipGroup.add(finLeft);
        const finRight = new THREE.Mesh(finGeo, finMat);
        finRight.position.set(1.3, 0, -0.2);
        shipGroup.add(finRight);
        
        // 엔진
        const engineGeo = new THREE.CylinderGeometry(0.25, 0.5, 1, 8);
        const engineMat = new THREE.MeshStandardMaterial({ 
          color: 0xff4400, 
          roughness: 0.1, 
          emissive: 0xff2200,
          emissiveIntensity: 2
        });
        this.engineGlow = new THREE.Mesh(engineGeo, engineMat);
        this.engineGlow.position.z = 1.6;
        shipGroup.add(this.engineGlow);
        
        this.player = shipGroup;
        this.player.position.set(0, -3, 0);
        this.scene.add(this.player);
      }
      
      initLights() {
        const ambient = new THREE.AmbientLight(0x334466, 1.8);
        this.scene.add(ambient);
        const sunLight = new THREE.DirectionalLight(0xffffff, 3);
        sunLight.position.set(10, 20, 5);
        this.scene.add(sunLight);
        const pointLight = new THREE.PointLight(0xff4400, 20, 15);
        pointLight.position.z = 2;
        this.player.add(pointLight);
      }
      
      initAudio() {
        this.audioCtx = null;
        try {
          this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch(e) {}
        this.sfxVolume = 0.2;
      }
      
      playSound(freq, duration, type = 'square') {
        if (!this.audioCtx) return;
        try {
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
          gain.gain.setValueAtTime(this.sfxVolume, this.audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.audioCtx.destination);
          osc.start();
          osc.stop(this.audioCtx.currentTime + duration);
        } catch(e) {}
      }
      
      // 🔧 수정된 발사 함수 - 마우스 방향으로 총알 발사
      shoot() {
        if (this.fireCooldown > 0 || this.isGameOver) return;
        this.fireCooldown = this.fireRate;
        
        // 총알 메쉬
        const bulletGeo = new THREE.CylinderGeometry(0.1, 0.1, 1, 6);
        const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const bullet = new THREE.Mesh(bulletGeo, bulletMat);
        
        // 발사 위치 (우주선 앞)
        const spawnPos = this.player.position.clone();
        spawnPos.z += 1.8;
        bullet.position.copy(spawnPos);
        
        // 🔥 핵심 수정: 마우스 방향으로 발사
        const direction = this.targetDirection.clone().normalize();
        
        // 총알이 향하는 방향으로 회전
        bullet.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          direction.clone().normalize()
        );
        
        const speed = 1.2;
        bullet.userData = { 
          velocity: direction.multiplyScalar(speed),
          life: 80 
        };
        
        this.scene.add(bullet);
        this.bullets.push(bullet);
        
        // 총구 섬광
        this.createMuzzleFlash(spawnPos);
        this.playSound(800, 0.06, 'square');
      }
      
      createMuzzleFlash(position) {
        const flashGeo = new THREE.SphereGeometry(0.35, 8, 8);
        const flashMat = new THREE.MeshBasicMaterial({ 
          color: 0x00ffff, 
          transparent: true, 
          opacity: 0.9 
        });
        const flash = new THREE.Mesh(flashGeo, flashMat);
        flash.position.copy(position);
        flash.userData = { life: 6, type: 'flash' };
        this.scene.add(flash);
        this.particles.push(flash);
      }
      
      // 마우스 위치로부터 발사 방향 계산
      updateTargetDirection() {
        this.mouseVector.set(this.mouseX, this.mouseY);
        this.raycaster.setFromCamera(this.mouseVector, this.camera);
        
        // 레이캐스터 방향을 타겟 방향으로 사용
        this.targetDirection.copy(this.raycaster.ray.direction);
        
        // 크로스헤어 위치 업데이트
        const crosshair = document.getElementById('crosshair');
        if (crosshair) {
          crosshair.style.left = ((this.mouseX + 1) / 2 * window.innerWidth) + 'px';
          crosshair.style.top = ((-this.mouseY + 1) / 2 * window.innerHeight) + 'px';
        }
      }
      
      spawnEnemy() {
        if (this.isGameOver) return;
        const types = [
          { geo: new THREE.IcosahedronGeometry(0.8, 1), color: 0xff3344, health: 2, speed: 0.22, points: 100 },
          { geo: new THREE.OctahedronGeometry(0.9, 0), color: 0xff8800, health: 3, speed: 0.16, points: 200 },
          { geo: new THREE.DodecahedronGeometry(0.7, 0), color: 0xff00ff, health: 5, speed: 0.13, points: 500 }
        ];
        const type = types[Math.floor(Math.random() * types.length)];
        const enemy = new THREE.Mesh(type.geo, new THREE.MeshStandardMaterial({ 
          color: type.color, 
          roughness: 0.3, 
          metalness: 0.5,
          emissive: type.color,
          emissiveIntensity: 0.6
        }));
        
        // 적 생성 위치 (z축 깊이 분산)
        enemy.position.set(
          (Math.random() - 0.5) * 34,
          (Math.random() - 0.5) * 22 + 3,
          -15 - Math.random() * 25
        );
        
        enemy.userData = {
          health: type.health,
          maxHealth: type.health,
          speed: type.speed,
          points: type.points,
          type: 'enemy',
          wobble: Math.random() * Math.PI * 2,
          wobbleSpeed: 0.5 + Math.random() * 1.5
        };
        this.scene.add(enemy);
        this.enemies.push(enemy);
      }
      
      createExplosion(position, color = 0xff4400) {
        for (let i = 0; i < 25; i++) {
          const particleGeo = new THREE.SphereGeometry(0.1, 4, 4);
          const particleMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
          const particle = new THREE.Mesh(particleGeo, particleMat);
          particle.position.copy(position);
          particle.userData = {
            velocity: new THREE.Vector3(
              (Math.random() - 0.5) * 0.8,
              (Math.random() - 0.5) * 0.8,
              (Math.random() - 0.5) * 0.8
            ),
            life: 20 + Math.random() * 20,
            type: 'particle'
          };
          this.scene.add(particle);
          this.particles.push(particle);
        }
        this.playSound(100, 0.25, 'sawtooth');
      }
      
      damagePlayer(amount) {
        if (this.isGameOver) return;
        this.health = Math.max(0, this.health - amount);
        document.getElementById('healthFill').style.width = this.health + '%';
        
        // 피격 이펙트
        if (this.health > 0) {
          this.player.children.forEach(child => {
            if (child.material && child.material.emissive) {
              child.material.emissive.set(0xff0000);
              setTimeout(() => {
                if (child.material) child.material.emissive.set(0x112244);
              }, 150);
            }
          });
        }
        
        if (this.health <= 0) this.gameOver();
      }
      
      gameOver() {
        this.isGameOver = true;
        document.getElementById('finalScore').textContent = this.score;
        document.getElementById('gameOverScreen').classList.add('active');
        document.getElementById('controlsHint').style.display = 'none';
        this.createExplosion(this.player.position.clone(), 0xff0000);
        this.createExplosion(this.player.position.clone().add(new THREE.Vector3(1,0,0)), 0xff6600);
        this.player.visible = false;
        this.playSound(50, 0.6, 'sawtooth');
      }
      
      restart() {
        this.score = 0;
        this.combo = 1;
        this.comboTimer = 0;
        this.health = 100;
        this.isGameOver = false;
        this.player.visible = true;
        this.player.position.set(0, -3, 0);
        document.getElementById('healthFill').style.width = '100%';
        document.getElementById('scoreDisplay').textContent = '0';
        document.getElementById('comboDisplay').textContent = 'x1';
        document.getElementById('gameOverScreen').classList.remove('active');
        document.getElementById('controlsHint').style.display = 'block';
        
        // 클린업
        [...this.enemies, ...this.bullets, ...this.particles].forEach(obj => {
          this.scene.remove(obj);
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        this.enemies = [];
        this.bullets = [];
        this.particles = [];
        this.fireCooldown = 0;
      }
      
      update() {
        if (this.isGameOver) {
          this.starField.position.z += 0.08;
          return;
        }
        
        // 타겟 방향 업데이트
        this.updateTargetDirection();
        
        // 플레이어 이동 (부드러운跟随)
        const targetX = this.mouseX * 15;
        const targetY = this.mouseY * 10 - 3;
        this.player.position.x += (targetX - this.player.position.x) * 0.1;
        this.player.position.y += (targetY - this.player.position.y) * 0.1;
        
        // 우주선 회전
        const tiltZ = (targetX - this.player.position.x) * 0.6;
        const tiltX = (targetY - this.player.position.y) * 0.3;
        this.player.rotation.z = THREE.MathUtils.lerp(this.player.rotation.z, tiltZ, 0.1);
        this.player.rotation.x = THREE.MathUtils.lerp(this.player.rotation.x, tiltX, 0.1);
        
        // 엔진 글로우 애니메이션
        if (this.engineGlow) {
          this.engineGlow.material.emissiveIntensity = 1.5 + Math.sin(Date.now() * 0.025) * 1;
        }
        
        // 발사
        if (this.isFiring) this.shoot();
        this.fireCooldown = Math.max(0, this.fireCooldown - 1);
        
        // 총알 업데이트
        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const bullet = this.bullets[i];
          bullet.position.add(bullet.userData.velocity);
          bullet.userData.life--;
          
          if (bullet.userData.life <= 0 || 
              Math.abs(bullet.position.x) > 25 ||
              Math.abs(bullet.position.y) > 20 ||
              bullet.position.z > 15 ||
              bullet.position.z < -40) {
            this.scene.remove(bullet);
            bullet.geometry.dispose();
            bullet.material.dispose();
            this.bullets.splice(i, 1);
          }
        }
        
        // 적 업데이트
        for (let i = this.enemies.length - 1; i >= 0; i--) {
          const enemy = this.enemies[i];
          enemy.position.z += enemy.userData.speed;
          enemy.position.x += Math.sin(enemy.userData.wobble + Date.now() * 0.003 * enemy.userData.wobbleSpeed) * 0.04;
          enemy.rotation.x += 0.02;
          enemy.rotation.y += 0.03;
          
          // 총알 충돌 체크
          let enemyHit = false;
          for (let j = this.bullets.length - 1; j >= 0; j--) {
            const bullet = this.bullets[j];
            const dist = bullet.position.distanceTo(enemy.position);
            if (dist < 1.3) {
              enemy.userData.health--;
              
              // 피격 이펙트
              this.createExplosion(bullet.position.clone(), 0xffff00);
              
              this.scene.remove(bullet);
              bullet.geometry.dispose();
              bullet.material.dispose();
              this.bullets.splice(j, 1);
              
              if (enemy.userData.health <= 0) {
                this.createExplosion(enemy.position.clone());
                this.score += enemy.userData.points * this.combo;
                this.combo = Math.min(10, this.combo + 1);
                this.comboTimer = 120;
                document.getElementById('scoreDisplay').textContent = this.score;
                document.getElementById('comboDisplay').textContent = 'x' + this.combo;
                this.scene.remove(enemy);
                enemy.geometry.dispose();
                enemy.material.dispose();
                this.enemies.splice(i, 1);
                enemyHit = true;
                this.playSound(500, 0.08, 'triangle');
              }
              break;
            }
          }
          if (enemyHit) continue;
          
          // 플레이어 충돌 또는 화면 이탈
          if (enemy.position.z > 5) {
            this.scene.remove(enemy);
            enemy.geometry.dispose();
            enemy.material.dispose();
            this.enemies.splice(i, 1);
            this.damagePlayer(12);
            this.combo = Math.max(1, this.combo - 1);
          } else if (enemy.position.distanceTo(this.player.position) < 2.5) {
            this.scene.remove(enemy);
            enemy.geometry.dispose();
            enemy.material.dispose();
            this.enemies.splice(i, 1);
            this.damagePlayer(20);
            this.createExplosion(enemy.position.clone(), 0xff0000);
            this.combo = 1;
          }
        }
        
        // 파티클 업데이트
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.userData.life--;
          if (p.userData.velocity) p.position.add(p.userData.velocity);
          if (p.material.opacity !== undefined) {
            p.material.opacity = Math.max(0, p.userData.life / 30);
          }
          p.scale.multiplyScalar(0.96);
          if (p.userData.life <= 0) {
            this.scene.remove(p);
            p.geometry.dispose();
            p.material.dispose();
            this.particles.splice(i, 1);
          }
        }
        
        // 콤보 타이머
        if (this.comboTimer > 0) {
          this.comboTimer--;
          if (this.comboTimer === 0) this.combo = 1;
          document.getElementById('comboDisplay').textContent = 'x' + this.combo;
        }
        
        // 적 생성
        const spawnRate = 0.02 + this.score * 0.00008;
        if (Math.random() < Math.min(spawnRate, 0.08)) {
          this.spawnEnemy();
        }
        
        // 배경 스크롤
        this.starField.position.z += 0.12;
        if (this.starField.position.z > 5) this.starField.position.z -= 10;
      }
      
      animate() {
        requestAnimationFrame(() => this.animate());
        this.update();
        this.composer.render();
      }
      
      bindEvents() {
        const canvas = this.renderer.domElement;
        
        // 마우스 이동
        canvas.addEventListener('mousemove', (e) => {
          this.mouseX = (e.clientX / window.innerWidth) * 2 - 1;
          this.mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });
        
        // 터치 이동
        canvas.addEventListener('touchmove', (e) => {
          e.preventDefault();
          this.mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
          this.mouseY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
          this.isFiring = true;
        }, { passive: false });
        
        canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          this.isFiring = true;
          if (this.audioCtx?.state === 'suspended') this.audioCtx.resume();
          document.getElementById('crosshair').style.display = 'block';
        });
        
        canvas.addEventListener('touchend', () => {
          this.isFiring = false;
        });
        
        canvas.addEventListener('mousedown', () => {
          this.isFiring = true;
          if (this.audioCtx?.state === 'suspended') this.audioCtx.resume();
          document.getElementById('crosshair').style.display = 'block';
        });
        
        canvas.addEventListener('mouseup', () => {
          this.isFiring = false;
        });
        
        // 리사이즈
        window.addEventListener('resize', () => {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.composer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // 재시작
        document.getElementById('restartButton').addEventListener('click', () => this.restart());
      }
    }
    
    // 게임 시작
    const game = new StarCommander();
    console.log('🚀 스타 커맨더 발사 준비 완료!');
  </script>
</body>

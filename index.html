<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🌟 스타 카드 마스터 - 트레이딩 카드 가챠</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3a 50%, #0a0a1a 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 10px;
    }
    .app {
      max-width: 750px;
      width: 100%;
    }
    /* 헤더 */
    .header {
      background: linear-gradient(135deg, #1a1a3a, #2a2a5a);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border: 1px solid #4a4a8a;
      margin-bottom: 10px;
    }
    .resources {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
    }
    .resource {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: bold;
      font-size: 0.95rem;
    }
    .resource span {
      color: #ffd700;
    }
    .level-badge {
      background: linear-gradient(135deg, #c9a44b, #8b6914);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    /* 탭 */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 16px;
      background: #2a2a4a;
      border: 1px solid #4a4a7a;
      border-radius: 10px 10px 0 0;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: 0.2s;
      color: #aaa;
    }
    .tab.active {
      background: #3a3a6a;
      color: #ffd700;
      border-color: #c9a44b;
      box-shadow: 0 -2px 15px rgba(201, 164, 75, 0.3);
    }
    /* 컨텐츠 */
    .content {
      background: #1a1a3a;
      border-radius: 0 0 16px 16px;
      padding: 16px;
      min-height: 450px;
      border: 1px solid #4a4a8a;
      border-top: none;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    /* 가챠 */
    .gacha-banner {
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #2a1a4a, #1a2a4a);
      border-radius: 16px;
      margin-bottom: 16px;
    }
    .gacha-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 20px #ffd700;
      margin-bottom: 6px;
    }
    .gacha-card {
      display: inline-block;
      width: 140px;
      height: 200px;
      background: linear-gradient(135deg, #3a3a6a, #2a2a4a);
      border-radius: 12px;
      margin: 10px;
      border: 3px solid #c9a44b;
      box-shadow: 0 0 30px rgba(201, 164, 75, 0.4);
      animation: float 3s infinite;
    }
    @keyframes float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }
    .gacha-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .gacha-btn {
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      color: #fff;
      font-size: 1rem;
      transition: 0.2s;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
    }
    .gacha-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
    }
    .btn-single {
      background: #4a4a8a;
    }
    .btn-ten {
      background: #c9a44b;
      color: #000;
    }
    .gacha-result {
      margin-top: 12px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.85rem;
    }
    /* 카드 컬렉션 */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
      padding: 5px;
    }
    .card-item {
      background: linear-gradient(135deg, #2a2a4a, #1a1a3a);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      border: 2px solid #4a4a7a;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
    }
    .card-item:hover {
      border-color: #c9a44b;
      box-shadow: 0 0 15px rgba(201, 164, 75, 0.3);
    }
    .card-item.legendary {
      border-color: #ff8800;
      box-shadow: 0 0 20px rgba(255, 136, 0, 0.5);
      animation: legendaryGlow 2s infinite;
    }
    @keyframes legendaryGlow {
      0%,
      100% {
        box-shadow: 0 0 20px rgba(255, 136, 0, 0.5);
      }
      50% {
        box-shadow: 0 0 40px rgba(255, 136, 0, 0.8);
      }
    }
    .card-item .icon {
      font-size: 2.5rem;
    }
    .card-item .name {
      font-weight: bold;
      font-size: 0.8rem;
      margin: 4px 0;
    }
    .card-item .rarity {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 8px;
      display: inline-block;
    }
    .rarity-common {
      background: #888;
      color: #fff;
    }
    .rarity-rare {
      background: #4af;
      color: #fff;
    }
    .rarity-epic {
      background: #a0f;
      color: #fff;
    }
    .rarity-legendary {
      background: #f80;
      color: #fff;
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }
    .card-item .level {
      font-size: 0.7rem;
      color: #aaa;
    }
    .card-count {
      position: absolute;
      top: 5px;
      right: 8px;
      background: #000;
      color: #ffd700;
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 10px;
    }
    /* 상점 */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .shop-item {
      background: #2a2a4a;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      border: 2px solid #4a4a7a;
    }
    .shop-item button {
      margin-top: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      border: none;
      font-weight: bold;
      background: #c9a44b;
      color: #000;
      font-size: 0.8rem;
    }
    /* 퀘스트 */
    .quest-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .quest-item {
      background: #2a2a4a;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #4a4a7a;
    }
    .quest-item button {
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      border: none;
      font-weight: bold;
      background: #3a8b5a;
      color: #fff;
      font-size: 0.8rem;
    }
    .quest-item button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #3a3a5a;
      border-radius: 3px;
      margin-top: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #ffd700;
      transition: width 0.3s;
    }
    /* 덱 빌더 */
    .deck-area {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .deck-slot {
      width: 80px;
      height: 110px;
      border: 2px dashed #4a4a7a;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.7rem;
      text-align: center;
      transition: 0.2s;
    }
    .deck-slot.filled {
      border: 2px solid #c9a44b;
      background: #2a2a4a;
    }
    .deck-slot:hover {
      border-color: #ffd700;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #2a2a5a;
      border-radius: 16px;
      padding: 20px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 2px solid #c9a44b;
    }
    .modal-content button {
      margin-top: 12px;
      padding: 10px 24px;
      border-radius: 20px;
      cursor: pointer;
      border: none;
      font-weight: bold;
      background: #c9a44b;
      color: #000;
    }
    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    @media (max-width: 500px) {
      .gacha-card {
        width: 100px;
        height: 150px;
      }
      .card-grid {
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 헤더 -->
    <div class="header">
      <div class="resources">
        <div class="resource">💎 <span id="gemDisplay">500</span></div>
        <div class="resource">🪙 <span id="goldDisplay">1000</span></div>
        <div class="resource">⭐ <span id="dustDisplay">50</span></div>
      </div>
      <div class="level-badge">🎖️ Lv.<span id="playerLevel">1</span></div>
    </div>

    <!-- 탭 -->
    <div class="tabs">
      <div class="tab active" data-tab="gacha">🎴 가챠</div>
      <div class="tab" data-tab="collection">📚 컬렉션</div>
      <div class="tab" data-tab="deck">⚔️ 덱 빌더</div>
      <div class="tab" data-tab="shop">🛒 상점</div>
      <div class="tab" data-tab="quest">📋 퀘스트</div>
    </div>

    <!-- 컨텐츠 -->
    <div class="content">
      <!-- 가챠 -->
      <div class="tab-content active" id="tab-gacha">
        <div class="gacha-banner">
          <div class="gacha-title">🌟 스타 카드 소환</div>
          <div class="gacha-card" id="gachaPreview">
            <div style="font-size:4rem;color:#ffd700;">?</div>
            <div style="color:#aaa;">카드</div>
          </div>
          <p style="color:#aaa;font-size:0.8rem;">전설: 3% | 에픽: 12% | 레어: 35% | 일반: 50%</p>
          <div style="margin:8px 0;">
            <span style="color:#f80;">⭐ 전설 천장까지 </span>
            <span id="pityCounter">0</span>/80
          </div>
          <div class="gacha-buttons">
            <button class="gacha-btn btn-single" id="pullOne">🔮 1회 (50💎)</button>
            <button class="gacha-btn btn-ten" id="pullTen">🌟 10+1회 (450💎)</button>
          </div>
          <div class="gacha-result" id="gachaResult"></div>
        </div>
      </div>

      <!-- 컬렉션 -->
      <div class="tab-content" id="tab-collection">
        <div style="margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="tab" style="border-radius:20px;font-size:0.75rem;" data-filter="all">전체</button>
          <button class="tab" style="border-radius:20px;font-size:0.75rem;" data-filter="legendary">⭐전설</button>
          <button class="tab" style="border-radius:20px;font-size:0.75rem;" data-filter="epic">에픽</button>
          <button class="tab" style="border-radius:20px;font-size:0.75rem;" data-filter="rare">레어</button>
          <button class="tab" style="border-radius:20px;font-size:0.75rem;" data-filter="common">일반</button>
        </div>
        <div class="card-grid" id="collectionGrid"></div>
        <div id="cardDetail" style="margin-top:10px;"></div>
      </div>

      <!-- 덱 빌더 -->
      <div class="tab-content" id="tab-deck">
        <h3 style="margin-bottom:10px;">⚔️ 내 덱 (최대 5장)</h3>
        <div class="deck-area" id="deckSlots"></div>
        <p style="color:#aaa;font-size:0.8rem;margin-top:8px;">컬렉션에서 카드를 클릭하여 덱에 추가하세요</p>
        <div style="margin-top:10px;">
          <strong>덱 파워:</strong> <span id="deckPower">0</span>
        </div>
      </div>

      <!-- 상점 -->
      <div class="tab-content" id="tab-shop">
        <div class="shop-grid">
          <div class="shop-item">
            <div style="font-size:2rem;">💎</div>
            <strong>300 다이아</strong>
            <p style="color:#aaa;font-size:0.8rem;">₩3,000</p>
            <button onclick="buyShop('gems300')">구매</button>
          </div>
          <div class="shop-item">
            <div style="font-size:2rem;">🎫</div>
            <strong>가챠 티켓 x5</strong>
            <p style="color:#aaa;font-size:0.8rem;">1000💰</p>
            <button onclick="buyShop('tickets5')">구매</button>
          </div>
          <div class="shop-item">
            <div style="font-size:2rem;">⭐</div>
            <strong>진화의 돌</strong>
            <p style="color:#aaa;font-size:0.8rem;">500💰</p>
            <button onclick="buyShop('evoStone')">구매</button>
          </div>
        </div>
      </div>

      <!-- 퀘스트 -->
      <div class="tab-content" id="tab-quest">
        <div class="quest-list" id="questList"></div>
      </div>
    </div>

    <!-- 모달 -->
    <div class="modal" id="modal" style="display:none;">
      <div class="modal-content" id="modalContent"></div>
    </div>
  </div>

  <script>
    (() => {
      // ==================== 카드 데이터 ====================
      const CARD_DATABASE = [
        { id: 'c01', name: '불꽃 전사', icon: '⚔️🔥', rarity: 'common', hp: 100, atk: 30, element: 'fire' },
        { id: 'c02', name: '얼음 마법사', icon: '🧊❄️', rarity: 'common', hp: 80, atk: 35, element: 'ice' },
        { id: 'c03', name: '바람 궁수', icon: '🏹💨', rarity: 'common', hp: 90, atk: 28, element: 'wind' },
        { id: 'c04', name: '대지 수호자', icon: '🛡️⛰️', rarity: 'common', hp: 130, atk: 18, element: 'earth' },
        { id: 'c05', name: '번개 검사', icon: '⚡🗡️', rarity: 'rare', hp: 140, atk: 45, element: 'lightning' },
        { id: 'c06', name: '그림자 암살자', icon: '🥷🌑', rarity: 'rare', hp: 110, atk: 55, element: 'dark' },
        { id: 'c07', name: '신성한 사제', icon: '✨🙏', rarity: 'rare', hp: 160, atk: 25, element: 'holy' },
        { id: 'c08', name: '용기사', icon: '🐉⚔️', rarity: 'epic', hp: 220, atk: 65, element: 'fire' },
        { id: 'c09', name: '대마법사', icon: '🔮🌟', rarity: 'epic', hp: 180, atk: 75, element: 'arcane' },
        { id: 'c10', name: '천사장', icon: '👼✨', rarity: 'epic', hp: 250, atk: 55, element: 'holy' },
        { id: 'c11', name: '태초의 드래곤', icon: '🐲💥', rarity: 'legendary', hp: 400, atk: 120, element: 'fire' },
        { id: 'c12', name: '시공의 지배자', icon: '⏳🌌', rarity: 'legendary', hp: 350, atk: 140, element: 'arcane' },
        { id: 'c13', name: '혼돈의 군주', icon: '👑💀', rarity: 'legendary', hp: 380, atk: 130, element: 'dark' },
      ];

      // ==================== 상태 ====================
      let gems = 500;
      let gold = 1000;
      let dust = 50;
      let tickets = 0;
      let playerLevel = 1;
      let pityCount = 0;
      const PITY_MAX = 80;

      // 보유 카드: { cardId: { count, level, exp } }
      let ownedCards = {};
      // 덱 (최대 5장)
      let deck = [];
      // 퀘스트
      let quests = [];
      let cardsOpened = 0;
      let enemiesDefeated = 0;

      // ==================== 초기화 ====================
      function initGame() {
        // 기본 카드 3장 지급
        addCard('c01', 1);
        addCard('c02', 1);
        addCard('c03', 1);
        initQuests();
        loadGame();
        updateAllUI();
      }

      function addCard(cardId, count = 1) {
        if (!ownedCards[cardId]) {
          ownedCards[cardId] = { count: 0, level: 1, exp: 0 };
        }
        ownedCards[cardId].count += count;
        cardsOpened += count;
      }

      function initQuests() {
        quests = [
          { id: 'q1', name: '카드 10장 수집', goal: 10, progress: 0, reward: { gems: 100 }, claimed: false },
          { id: 'q2', name: '카드 50장 수집', goal: 50, progress: 0, reward: { tickets: 3 }, claimed: false },
          { id: 'q3', name: '레어 이상 카드 5장', goal: 5, progress: 0, reward: { dust: 100 }, claimed: false },
          { id: 'q4', name: '에픽 이상 카드 2장', goal: 2, progress: 0, reward: { gems: 300 }, claimed: false },
        ];
        updateQuestProgress();
      }

      function updateQuestProgress() {
        const rareCount = Object.values(ownedCards).reduce((sum, c) => {
          const card = CARD_DATABASE.find(cd => cd.id === Object.keys(ownedCards).find(k => ownedCards[k] === c));
          return sum;
        }, 0);

        for (const q of quests) {
          if (q.id === 'q1' || q.id === 'q2') q.progress = cardsOpened;
          if (q.id === 'q3') {
            q.progress = Object.entries(ownedCards).filter(([id, data]) => {
              const card = CARD_DATABASE.find(c => c.id === id);
              return card && (card.rarity === 'rare' || card.rarity === 'epic' || card.rarity === 'legendary');
            }).length;
          }
          if (q.id === 'q4') {
            q.progress = Object.entries(ownedCards).filter(([id, data]) => {
              const card = CARD_DATABASE.find(c => c.id === id);
              return card && (card.rarity === 'epic' || card.rarity === 'legendary');
            }).length;
          }
        }
      }

      // ==================== 가챠 ====================
      function pullGacha(times) {
        const actualPulls = times >= 10 ? times + 1 : times;
        const cost = times >= 10 ? 450 : 50 * times;

        if (tickets > 0 && times === 1) {
          tickets--;
        } else {
          if (gems < cost) return showModal('❌ 다이아가 부족합니다!');
          gems -= cost;
        }

        const results = [];
        for (let i = 0; i < actualPulls; i++) {
          pityCount++;
          let rarity;
          const roll = Math.random() * 100;

          if (pityCount >= PITY_MAX || roll < 3) {
            rarity = 'legendary';
            pityCount = 0;
          } else if (roll < 15) {
            rarity = 'epic';
          } else if (roll < 50) {
            rarity = 'rare';
          } else {
            rarity = 'common';
          }

          const pool = CARD_DATABASE.filter(c => c.rarity === rarity);
          const card = pool[Math.floor(Math.random() * pool.length)];
          addCard(card.id, 1);
          results.push(card);
        }

        updateQuestProgress();
        updateAllUI();
        showGachaResult(results);
        saveGame();
      }

      function showGachaResult(results) {
        const container = document.getElementById('gachaResult');
        const legendary = results.filter(r => r.rarity === 'legendary');
        const epic = results.filter(r => r.rarity === 'epic');

        let html = '';
        if (legendary.length > 0) {
          html += '<div style="color:#f80;font-size:1.3rem;animation:pulse 0.5s;">🌟 전설 카드 획득!!</div>';
        }
        html += results.slice(0, 8).map(r =>
          `<span style="color:${r.rarity === 'legendary' ? '#f80' : r.rarity === 'epic' ? '#a0f' : r.rarity === 'rare' ? '#4af' : '#aaa'}">${r.icon}${r.name}</span>`
        ).join(', ');
        if (results.length > 8) html += ` 외 ${results.length - 8}장`;
        container.innerHTML = html;

        if (legendary.length > 0 || epic.length >= 2) {
          showModal('🎉 대박! ' + (legendary.length > 0 ? '전설 카드 획득!' : '에픽 카드 2장!'));
        }
      }

      // ==================== 카드 진화 ====================
      function evolveCard(cardId) {
        const card = CARD_DATABASE.find(c => c.id === cardId);
        if (!card || !ownedCards[cardId]) return;
        if (dust < 30 * ownedCards[cardId].level) return showModal('⭐ 진화의 돌이 부족합니다!');

        dust -= 30 * ownedCards[cardId].level;
        ownedCards[cardId].level++;
        ownedCards[cardId].exp = 0;

        const newHp = Math.floor(card.hp * (1 + (ownedCards[cardId].level - 1) * 0.2));
        const newAtk = Math.floor(card.atk * (1 + (ownedCards[cardId].level - 1) * 0.2));

        updateAllUI();
        saveGame();
        showModal(`🆙 ${card.icon} ${card.name} Lv.${ownedCards[cardId].level}로 진화!\nHP: ${newHp} ATK: ${newAtk}`);
      }

      function getCardStats(cardId) {
        const card = CARD_DATABASE.find(c => c.id === cardId);
        if (!card || !ownedCards[cardId]) return null;
        const lv = ownedCards[cardId].level;
        return {
          hp: Math.floor(card.hp * (1 + (lv - 1) * 0.2)),
          atk: Math.floor(card.atk * (1 + (lv - 1) * 0.2)),
          level: lv,
        };
      }

      // ==================== 덱 빌더 ====================
      function toggleDeckCard(cardId) {
        if (deck.includes(cardId)) {
          deck = deck.filter(id => id !== cardId);
        } else {
          if (deck.length >= 5) return showModal('⚠️ 덱은 최대 5장까지!');
          if (!ownedCards[cardId] || ownedCards[cardId].count <= 0) return;
          deck.push(cardId);
        }
        updateAllUI();
        saveGame();
      }

      function getDeckPower() {
        return deck.reduce((sum, cardId) => {
          const stats = getCardStats(cardId);
          return sum + (stats ? stats.hp + stats.atk * 2 : 0);
        }, 0);
      }

      // ==================== 상점 ====================
      function buyShop(item) {
        switch (item) {
          case 'gems300':
            gems += 300;
            break;
          case 'tickets5':
            if (gold < 1000) return showModal('💰 골드가 부족합니다!');
            gold -= 1000;
            tickets += 5;
            break;
          case 'evoStone':
            if (gold < 500) return showModal('💰 골드가 부족합니다!');
            gold -= 500;
            dust += 50;
            break;
        }
        updateAllUI();
        saveGame();
        showModal('✅ 구매 완료!');
      }

      // ==================== 퀘스트 클레임 ====================
      function claimQuest(questId) {
        const q = quests.find(q => q.id === questId);
        if (!q || q.claimed) return;
        if (q.progress < q.goal) return showModal('📋 아직 목표를 달성하지 못했습니다!');

        q.claimed = true;
        if (q.reward.gems) gems += q.reward.gems;
        if (q.reward.tickets) tickets += q.reward.tickets;
        if (q.reward.dust) dust += q.reward.dust;
        updateAllUI();
        saveGame();
        showModal('🎁 퀘스트 보상 획득!');
      }

      // ==================== 모달 ====================
      function showModal(msg) {
        const modal = document.getElementById('modal');
        const content = document.getElementById('modalContent');
        content.innerHTML = `<p style="font-size:1.2rem;">${msg}</p><button onclick="document.getElementById('modal').style.display='none'">확인</button>`;
        modal.style.display = 'flex';
      }

      document.getElementById('modal').addEventListener('click', function(e) {
        if (e.target === this) this.style.display = 'none';
      });

      // ==================== UI 업데이트 ====================
      function updateAllUI() {
        document.getElementById('gemDisplay').textContent = gems.toLocaleString();
        document.getElementById('goldDisplay').textContent = gold.toLocaleString();
        document.getElementById('dustDisplay').textContent = dust.toLocaleString();
        document.getElementById('playerLevel').textContent = playerLevel;
        document.getElementById('pityCounter').textContent = pityCount;

        updateCollectionUI();
        updateDeckUI();
        updateQuestUI();
      }

      function updateCollectionUI() {
        const grid = document.getElementById('collectionGrid');
        const filter = document.querySelector('[data-filter].active')?.dataset?.filter || 'all';

        const entries = Object.entries(ownedCards).filter(([id, data]) => {
          const card = CARD_DATABASE.find(c => c.id === id);
          if (!card) return false;
          if (filter === 'all') return true;
          return card.rarity === filter;
        });

        grid.innerHTML = entries.map(([id, data]) => {
          const card = CARD_DATABASE.find(c => c.id === id);
          if (!card) return '';
          const stats = getCardStats(id);
          return `
            <div class="card-item ${card.rarity === 'legendary' ? 'legendary' : ''}" onclick="showCardDetail('${id}')">
              <div class="card-count">x${data.count}</div>
              <div class="icon">${card.icon}</div>
              <div class="name">${card.name}</div>
              <div class="rarity rarity-${card.rarity}">${card.rarity.toUpperCase()}</div>
              <div class="level">Lv.${stats.level} | ❤️${stats.hp} ⚔️${stats.atk}</div>
            </div>
          `;
        }).join('');
      }

      function updateDeckUI() {
        const slots = document.getElementById('deckSlots');
        let html = '';
        for (let i = 0; i < 5; i++) {
          if (i < deck.length) {
            const card = CARD_DATABASE.find(c => c.id === deck[i]);
            const stats = getCardStats(deck[i]);
            html += `<div class="deck-slot filled" onclick="toggleDeckCard('${deck[i]}')">
              <div>${card.icon}<br>${card.name}<br>Lv.${stats.level}</div>
            </div>`;
          } else {
            html += `<div class="deck-slot">빈 슬롯</div>`;
          }
        }
        slots.innerHTML = html;
        document.getElementById('deckPower').textContent = getDeckPower();
      }

      function updateQuestUI() {
        const list = document.getElementById('questList');
        list.innerHTML = quests.map(q => `
          <div class="quest-item">
            <div>
              <strong>${q.name}</strong>
              <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, q.progress/q.goal*100)}%"></div></div>
              <small>${q.progress}/${q.goal}</small>
            </div>
            <button ${q.claimed || q.progress < q.goal ? 'disabled' : ''} onclick="claimQuest('${q.id}')">
              ${q.claimed ? '완료' : '받기'}
            </button>
          </div>
        `).join('');
      }

      // ==================== 카드 상세 ====================
      window.showCardDetail = function(cardId) {
        const card = CARD_DATABASE.find(c => c.id === cardId);
        if (!card || !ownedCards[cardId]) return;
        const stats = getCardStats(cardId);
        const detail = document.getElementById('cardDetail');
        detail.innerHTML = `
          <div style="background:#2a2a4a;border-radius:12px;padding:14px;border:2px solid #c9a44b;">

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>🐾 너구리 게임 - 달리기 & 점프</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: linear-gradient(180deg, #2b5a3a 0%, #1e3b28 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
      padding: 20px;
      margin: 0;
    }
    .game-container {
      background: #87CEEB;
      border-radius: 20px;
      box-shadow: 0 20px 30px rgba(0,0,0,0.5);
      overflow: hidden;
      position: relative;
      width: 100%;
      max-width: 800px;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: #7ec8e0;
    }
    .info-panel {
      background: #f5e6d3;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      color: #3a2c1b;
      font-size: 1.2rem;
      flex-wrap: wrap;
      border-bottom: 3px solid #b89b7b;
    }
    .score-box {
      background: #ffd966;
      padding: 6px 18px;
      border-radius: 30px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
    }
    button {
      background: #d49c6b;
      border: none;
      color: white;
      font-weight: bold;
      padding: 8px 22px;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 5px 0 #8b5a3a;
      border: 1px solid #f5cba0;
      letter-spacing: 0.5px;
    }
    button:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #8b5a3a;
    }
    .mobile-controls {
      display: none;
      justify-content: center;
      background: #d9b382;
      padding: 10px;
    }
    @media (max-width: 600px) {
      .mobile-controls {
        display: flex;
      }
      .info-panel {
        font-size: 1rem;
        padding: 8px 15px;
      }
      button {
        padding: 6px 16px;
      }
    }
    .mobile-btn {
      background: #fde3a7;
      color: #4d2e1b;
      font-size: 2rem;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 20px;
      box-shadow: 0 6px 0 #b08968;
      user-select: none;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
<div style="display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 800px;">
  <div class="game-container">
    <div class="info-panel">
      <span>🐾 <span id="scoreDisplay">0</span> 점</span>
      <span class="score-box">🏆 최고: <span id="highScoreDisplay">0</span></span>
      <button id="restartButton">🔄 다시하기</button>
    </div>
    <canvas id="gameCanvas" width="800" height="300" aria-label="너구리 달리기 게임"></canvas>
    <div class="mobile-controls" id="mobileControls">
      <div class="mobile-btn" id="jumpMobileBtn">⬆️</div>
    </div>
  </div>
  <div style="color: #f7e3c0; margin-top: 15px; font-weight: bold; text-shadow: 2px 2px 0 #3b5e2b;">
    🦝 스페이스바 또는 화면 탭 / 위쪽 버튼으로 점프!
  </div>
</div>

<script>
  (function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 점수 표시 요소
    const scoreSpan = document.getElementById('scoreDisplay');
    const highScoreSpan = document.getElementById('highScoreDisplay');

    // 캔버스 크기
    const CANVAS_WIDTH = 800;
    const CANVAS_HEIGHT = 300;
    canvas.width = CANVAS_WIDTH;
    canvas.height = CANVAS_HEIGHT;

    // 지면 높이
    const GROUND_Y = 260;

    // 게임 상태
    let gameOver = false;
    let score = 0;
    let highScore = 0;

    // 프레임 관련
    let animationFrameId = null;
    let gameSpeed = 5.2;
    let frameCount = 0;

    // --- 너구리(플레이어) 속성 ---
    const player = {
      x: 120,
      y: GROUND_Y - 42,  // 발이 지면에 닿도록 (너구리 높이 약 42px)
      width: 38,
      height: 42,
      velocityY: 0,
      gravity: 0.7,
      jumpPower: -9.8,
      isJumping: false,
      grounded: true
    };

    // --- 장애물 배열 ---
    let obstacles = [];

    // 장애물 생성 타이머
    let obstacleTimer = 0;
    const OBSTACLE_INTERVAL_MIN = 55;  // 프레임 단위
    const OBSTACLE_INTERVAL_MAX = 95;

    // 장애물 종류
    const OBSTACLE_TYPES = [
      { name: 'cactus', width: 22, height: 36, color: '#2e6b2e' },
      { name: 'rock', width: 26, height: 22, color: '#6b5a4b' },
      { name: 'trash', width: 24, height: 28, color: '#b33e2c' }
    ];

    // 로컬 스토리지에서 최고 점수 불러오기
    try {
      const saved = localStorage.getItem('raccoonHighScore');
      if (saved) {
        highScore = parseInt(saved, 10) || 0;
      }
    } catch (e) { /* 무시 */ }
    highScoreSpan.textContent = highScore;

    // ---------- 유틸 함수 ----------
    function updateHighScoreDisplay() {
      highScoreSpan.textContent = highScore;
    }

    function setHighScore(newScore) {
      if (newScore > highScore) {
        highScore = newScore;
        updateHighScoreDisplay();
        try {
          localStorage.setItem('raccoonHighScore', highScore);
        } catch (e) {}
      }
    }

    // 게임 재시작
    function restartGame() {
      gameOver = false;
      score = 0;
      gameSpeed = 5.2;
      obstacles = [];
      obstacleTimer = 0;
      frameCount = 0;

      // 플레이어 초기화
      player.y = GROUND_Y - player.height;
      player.velocityY = 0;
      player.isJumping = false;
      player.grounded = true;

      scoreSpan.textContent = "0";
      updateHighScoreDisplay();
    }

    // 점프 동작
    function performJump() {
      if (gameOver) {
        // 게임 오버 상태에서 점프 입력 시 재시작 처리
        restartGame();
        return;
      }

      // 바닥에 있을 때만 점프 가능 (2단 점프 방지)
      if (player.grounded && !player.isJumping) {
        player.velocityY = player.jumpPower;
        player.isJumping = true;
        player.grounded = false;
      }
    }

    // 충돌 감지 (간단한 AABB)
    function checkCollision(rect1, rect2) {
      return rect1.x < rect2.x + rect2.width &&
             rect1.x + rect1.width > rect2.x &&
             rect1.y < rect2.y + rect2.height &&
             rect1.y + rect1.height > rect2.y;
    }

    // ---------- 게임 로직 업데이트 ----------
    function update() {
      if (gameOver) {
        // 게임 오버 상태에서는 업데이트 중지
        return;
      }

      // 점수 증가 (시간에 따라)
      score += 0.1;
      scoreSpan.textContent = Math.floor(score);

      // 속도 점진적 증가
      if (gameSpeed < 11) {
        gameSpeed += 0.002;
      }

      // --- 플레이어 물리 ---
      player.velocityY += player.gravity;
      player.y += player.velocityY;

      // 지면 충돌
      if (player.y >= GROUND_Y - player.height) {
        player.y = GROUND_Y - player.height;
        player.velocityY = 0;
        player.isJumping = false;
        player.grounded = true;
      } else {
        player.grounded = false;
      }

      // --- 장애물 관리 ---
      // 타이머 기반 생성
      if (obstacleTimer <= 0) {
        // 랜덤 장애물 유형 선택
        const typeIndex = Math.floor(Math.random() * OBSTACLE_TYPES.length);
        const type = OBSTACLE_TYPES[typeIndex];
        // 장애물 위치 (땅에 붙도록)
        const obstacleY = GROUND_Y - type.height;
        obstacles.push({
          x: CANVAS_WIDTH,
          y: obstacleY,
          width: type.width,
          height: type.height,
          type: type,
          color: type.color
        });

        // 다음 생성까지 프레임 간격 랜덤 설정
        obstacleTimer = Math.floor(Math.random() * (OBSTACLE_INTERVAL_MAX - OBSTACLE_INTERVAL_MIN) + OBSTACLE_INTERVAL_MIN);
        // 속도가 빨라질수록 약간 더 자주 등장
        obstacleTimer = Math.max(28, obstacleTimer - Math.floor(gameSpeed * 1.5));
      } else {
        obstacleTimer--;
      }

      // 장애물 이동 및 제거
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const obs = obstacles[i];
        obs.x -= gameSpeed;

        // 화면 밖으로 나가면 제거
        if (obs.x + obs.width < 0) {
          obstacles.splice(i, 1);
          continue;
        }

        // 플레이어와 충돌 검사
        const playerRect = {
          x: player.x,
          y: player.y,
          width: player.width,
          height: player.height
        };
        const obstacleRect = {
          x: obs.x,
          y: obs.y,
          width: obs.width,
          height: obs.height
        };

        if (checkCollision(playerRect, obstacleRect)) {
          // 게임 오버 처리
          gameOver = true;
          setHighScore(Math.floor(score));
          break; // 충돌 시 루프 중단
        }
      }

      // 게임 오버 시 최고 점수 갱신 (위에서 setHighScore 호출됨)
      if (gameOver) {
        setHighScore(Math.floor(score));
      }
    }

    // ---------- 그리기 ----------
    function drawGround() {
      // 땅
      ctx.fillStyle = '#5a8240';
      ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);
      // 잔디 라인
      ctx.fillStyle = '#3d6120';
      ctx.fillRect(0, GROUND_Y-2, CANVAS_WIDTH, 4);
      // 작은 풀 장식
      ctx.fillStyle = '#2d4a1a';
      for (let i = 0; i < 20; i++) {
        let x = (i * 45 + frameCount * 2) % 850 - 50;
        ctx.fillRect(x, GROUND_Y-6, 12, 6);
      }
    }

    function drawRaccoon(x, y, width, height) {
      const cx = x + width/2;
      const cy = y + height/2;

      // 몸통 (회색 갈색)
      ctx.fillStyle = '#6b5a4b';
      ctx.beginPath();
      ctx.ellipse(cx, cy+2, width*0.4, height*0.35, 0, 0, Math.PI*2);
      ctx.fill();

      // 배 부분
      ctx.fillStyle = '#b8a99a';
      ctx.beginPath();
      ctx.ellipse(cx, cy+4, width*0.25, height*0.28, 0, 0, Math.PI*2);
      ctx.fill();

      // 머리
      ctx.fillStyle = '#7a6a5a';
      ctx.beginPath();
      ctx.ellipse(cx-2, cy-8, width*0.32, height*0.38, 0, 0, Math.PI*2);
      ctx.fill();

      // 귀
      ctx.fillStyle = '#5a4a3a';
      ctx.beginPath();
      ctx.ellipse(cx-10, cy-18, 5, 8, -0.2, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx+6, cy-18, 5, 8, 0.2, 0, Math.PI*2);
      ctx.fill();

      // 귀 안쪽
      ctx.fillStyle = '#d9c8b2';
      ctx.beginPath();
      ctx.ellipse(cx-10, cy-18, 3, 5, -0.2, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx+6, cy-18, 3, 5, 0.2, 0, Math.PI*2);
      ctx.fill();

      // 눈 주변 마스크 (너구리 특징)
      ctx.fillStyle = '#3e3226';
      ctx.beginPath();
      ctx.ellipse(cx-7, cy-11, 5, 6, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(cx+3, cy-11, 5, 6, 0, 0, Math.PI*2);
      ctx.fill();

      // 눈 흰자
      ctx.fillStyle = 'white';
      ctx.beginPath();
      ctx.arc(cx-7, cy-12, 3.2, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx+3, cy-12, 3.2, 0, Math.PI*2);
      ctx.fill();

      // 눈동자
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(cx-6, cy-12, 1.8, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx+4, cy-12, 1.8, 0, Math.PI*2);
      ctx.fill();

      // 코
      ctx.fillStyle = '#2b1e0e';
      ctx.beginPath();
      ctx.arc(cx-2, cy-7, 2.2, 0, Math.PI*2);
      ctx.fill();

      // 꼬리 (줄무늬)
      ctx.fillStyle = '#5a4a3a';
      ctx.beginPath();
      ctx.moveTo(x+width-4, cy+2);
      ctx.quadraticCurveTo(x+width+6, cy-2, x+width+8, cy-14);
      ctx.lineWidth = 9;
      ctx.strokeStyle = '#4a3a2a';
      ctx.stroke();
      // 꼬리 줄무늬
      for (let s=0; s<3; s++) {
        ctx.fillStyle = '#3b2e22';
        ctx.beginPath();
        ctx.arc(x+width+2 + s*2, cy-8 + s*2, 2.8, 0, Math.PI*2);
        ctx.fill();
      }

      // 발
      ctx.fillStyle = '#3a2e22';
      ctx.fillRect(x+4, y+height-5, 8, 5);
      ctx.fillRect(x+width-12, y+height-5, 8, 5);
    }

    function drawObstacle(obs) {
      const { x, y, width, height, type } = obs;
      ctx.save();
      if (type.name === 'cactus') {
        ctx.fillStyle = '#2d5a27';
        ctx.fillRect(x, y, width, height);
        ctx.fillStyle = '#1f431a';
        ctx.fillRect(x+4, y-6, 6, 10);
        ctx.fillRect(x+width-10, y-4, 6, 8);
      } else if (type.name === 'rock') {
        ctx.fillStyle = '#6b5a4b';
        ctx.beginPath();
        ctx.ellipse(x+width/2, y+height/2, width/2, height/2.2, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#4d3e32';
        ctx.beginPath();
        ctx.ellipse(x+width/2-2, y+height/2-2, width/4, height/4, 0, 0, Math.PI*2);
        ctx.fill();
      } else if (type.name === 'trash') {
        ctx.fillStyle = '#b33e2c';
        ctx.fillRect(x, y, width, height-4);
        ctx.fillStyle = '#8c2b1c';
        ctx.fillRect(x+2, y-2, width-4, 5);
        ctx.fillStyle = '#d9b382';
        ctx.fillRect(x+6, y+4, 4, 6);
      }
      ctx.restore();
    }

    function drawGameOverOverlay() {
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = '#1e1e1e';
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'white';
      ctx.font = 'bold 32px "Arial"';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'black';
      ctx.shadowBlur = 10;
      ctx.fillText('🦝 게임 오버', CANVAS_WIDTH/2, CANVAS_HEIGHT/2-20);
      ctx.font = '18px "Arial"';
      ctx.fillText('스페이스바 또는 버튼으로 다시 시작', CANVAS_WIDTH/2, CANVAS_HEIGHT/2+35);
      ctx.shadowBlur = 0;
      ctx.shadowColor = 'transparent';
    }

    function drawAll() {
      ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // 하늘 그라데이션
      const gradient = ctx.createLinearGradient(0, 0, 0, CANVAS_HEIGHT);
      gradient.addColorStop(0, '#b3e0f2');
      gradient.addColorStop(0.8, '#dff4ff');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

      // 구름
      ctx.fillStyle = 'white';
      drawCloud(100, 40, 50);
      drawCloud(600, 70, 60);
      drawCloud(400, 25, 45);

      drawGround();

      // 장애물 그리기
      for (let obs of obstacles) {
        drawObstacle(obs);
      }

      // 너구리 그리기
      drawRaccoon(player.x, player.y, player.width, player.height);

      // 게임 오버 오버레이
      if (gameOver) {
        drawGameOverOverlay();
      }

      // 현재 점수 표시 (캔버스 안에도 작게)
      ctx.font = 'bold 16px "Arial"';
      ctx.fillStyle = '#2d3e1f';
      ctx.textAlign = 'right';
      ctx.fillText('점수: ' + Math.floor(score), CANVAS_WIDTH-25, 35);
    }

    function drawCloud(x, y, size) {
      ctx.beginPath();
      ctx.arc(x, y, size*0.6, 0, Math.PI*2);
      ctx.arc(x+size*0.5, y-size*0.2, size*0.7, 0, Math.PI*2);
      ctx.arc(x-size*0.4, y-size*0.1, size*0.7, 0, Math.PI*2);
      ctx.arc(x+size*0.2, y-size*0.5, size*0.65, 0, Math.PI*2);
      ctx.fill();
    }

    // 게임 루프
    function gameLoop() {
      update();
      drawAll();
      frameCount++;
      animationFrameId = requestAnimationFrame(gameLoop);
    }

    // ---------- 이벤트 리스너 ----------
    function handleKeyDown(e) {
      if (e.key === ' ' || e.key === 'Space' || e.code === 'Space') {
        e.preventDefault();
        performJump();
      }
      // R 키로 재시작 가능 (선택)
      if (e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        restartGame();
      }
    }

    function handleCanvasClick(e) {
      e.preventDefault();
      performJump();
    }

    // 모바일 점프 버튼
    document.getElementById('jumpMobileBtn').addEventListener('click', (e) => {
      e.preventDefault();
      performJump();
    });
    document.getElementById('jumpMobileBtn').addEventListener('touchstart', (e) => {
      e.preventDefault();
      performJump();
    });

    // 다시하기 버튼
    document.getElementById('restartButton').addEventListener('click', () => {
      restartGame();
    });

    // 윈도우 포커스 및 이벤트 연결
    window.addEventListener('keydown', handleKeyDown);
    canvas.addEventListener('click', handleCanvasClick);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      performJump();
    });

    // 시작
    restartGame(); // 초기 상태 세팅
    gameLoop();

    // 클린업 (필요시) - 페이지 이탈 시
    window.addEventListener('beforeunload', () => {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
    });

  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎰 마카오 골드 슬롯 - Macau Gold Slot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      background-image:
        radial-gradient(ellipse at 30% 20%, #1a0a2e 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, #2e1a0a 0%, transparent 50%),
        radial-gradient(ellipse at center, #0a0a0a 0%, #000 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      user-select: none;
      -webkit-user-select: none;
      padding: 10px;
      overflow-x: hidden;
    }
    .machine {
      background: linear-gradient(180deg, #1a1a1a 0%, #0d0d0d 30%, #1a1a1a 100%);
      border-radius: 25px;
      padding: 15px;
      box-shadow:
        0 0 0 6px #c9a44b,
        0 0 0 10px #8b6914,
        0 0 0 14px #c9a44b,
        0 0 0 18px #3d2a00,
        0 0 0 22px #1a0a00,
        0 20px 60px rgba(0,0,0,0.9),
        inset 0 0 100px rgba(255,215,0,0.05);
      max-width: 500px;
      width: 100%;
      position: relative;
      overflow: hidden;
    }
    .machine::before {
      content: '';
      position: absolute;
      top: -2px; left: 10%; right: 10%; height: 2px;
      background: linear-gradient(90deg, transparent, #ffd700, #fff, #ffd700, transparent);
      animation: scanLine 3s linear infinite;
    }
    @keyframes scanLine {
      0% { left: -50%; }
      100% { left: 150%; }
    }
    .top-display {
      background: #000;
      border: 3px solid #c9a44b;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }
    .jackpot-display {
      font-size: 1.8rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 20px #ffd700, 0 0 40px #f80, 0 0 60px #f00;
      animation: jackpotGlow 1s infinite;
      letter-spacing: 3px;
    }
    @keyframes jackpotGlow {
      0%,100% { text-shadow: 0 0 20px #ffd700, 0 0 40px #f80; }
      50% { text-shadow: 0 0 40px #ffd700, 0 0 80px #f80, 0 0 120px #f00; }
    }
    .jackpot-label {
      font-size: 0.7rem;
      color: #c9a44b;
      letter-spacing: 4px;
      text-transform: uppercase;
    }
    .screen {
      background: linear-gradient(180deg, #0a0a1a 0%, #0d0d2a 100%);
      border: 4px solid #c9a44b;
      border-radius: 15px;
      padding: 10px;
      position: relative;
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
      margin-bottom: 10px;
    }
    .reels-container {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 10px 0;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
    }
    .reel {
      width: 90px;
      height: 240px;
      background: linear-gradient(180deg, #111 0%, #1a1a2e 50%, #111 100%);
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 2px solid #333;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }
    .reel-strip {
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .reel.spinning .reel-strip {
      transition: transform 0.15s linear;
    }
    .reel.stopping .reel-strip {
      transition: transform 0.8s cubic-bezier(0.1, 0.8, 0.2, 1);
    }
    .symbol {
      width: 90px;
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      position: relative;
      flex-shrink: 0;
    }
    .symbol::after {
      content: '';
      position: absolute;
      top: 2px; left: 4px; right: 4px; bottom: 2px;
      border-radius: 8px;
      background: radial-gradient(ellipse at 50% 40%, rgba(255,255,255,0.1), transparent);
    }
    .payline-indicator {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: #ffd700;
      box-shadow: 0 0 15px #ffd700;
      z-index: 5;
      pointer-events: none;
    }
    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: #000;
      border-radius: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .info-item {
      color: #ffd700;
      font-weight: bold;
      font-size: 0.9rem;
    }
    .info-item span {
      color: #fff;
    }
    .bet-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .bet-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #c9a44b;
      background: #1a1a2e;
      color: #ffd700;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bet-btn:active { background: #c9a44b; color: #000; }
    .bet-amount {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
      min-width: 50px;
      text-align: center;
    }
    .spin-btn {
      width: 100%;
      padding: 16px;
      border-radius: 50px;
      border: 3px solid #ffd700;
      background: linear-gradient(180deg, #c9302c, #8b1a1a);
      color: #fff;
      font-size: 1.3rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 3px;
      transition: 0.2s;
      box-shadow: 0 6px 0 #5a0a0a, 0 0 30px rgba(255,0,0,0.3);
      margin-top: 10px;
      text-transform: uppercase;
      position: relative;
      overflow: hidden;
    }
    .spin-btn::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
      opacity: 0;
      transition: 0.3s;
    }
    .spin-btn:hover::after { opacity: 1; }
    .spin-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #5a0a0a, 0 0 15px rgba(255,0,0,0.2);
    }
    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }
    .win-display {
      text-align: center;
      font-size: 1.4rem;
      font-weight: bold;
      color: #ffd700;
      min-height: 35px;
      text-shadow: 0 0 15px #ffd700;
      transition: 0.3s;
      padding: 5px;
    }
    .win-display.bigwin {
      animation: bigWinPulse 0.5s infinite;
      font-size: 2rem;
    }
    @keyframes bigWinPulse {
      0%,100% { transform: scale(1); color: #ffd700; }
      50% { transform: scale(1.2); color: #fff; }
    }
    .feature-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: bold;
      animation: pulse 0.8s infinite;
      background: #f80;
      color: #fff;
    }
    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .particles-area {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }
    .coin-particle {
      position: absolute;
      font-size: 2rem;
      animation: coinFall 2s forwards;
      pointer-events: none;
    }
    @keyframes coinFall {
      0% { opacity: 1; transform: translateY(-100px) rotate(0deg); }
      100% { opacity: 0; transform: translateY(110vh) rotate(720deg); }
    }
    .jackpot-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      animation: fadeIn 0.5s;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .jackpot-text {
      font-size: 4rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 50px #ffd700, 0 0 100px #f80;
      animation: jackpotBig 0.3s infinite;
    }
    @keyframes jackpotBig {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    .balance-display {
      color: #ffd700;
      font-weight: bold;
      font-size: 1.1rem;
    }
    @media (max-width: 400px) {
      .reel { width: 65px; height: 180px; }
      .symbol { width: 65px; height: 60px; font-size: 2rem; }
      .spin-btn { font-size: 1rem; padding: 12px; }
      .jackpot-display { font-size: 1.3rem; }
    }
  </style>
</head>
<body>
  <div class="particles-area" id="particlesArea"></div>

  <div class="machine">
    <div class="top-display">
      <div class="jackpot-label">💎 GRAND JACKPOT 💎</div>
      <div class="jackpot-display" id="jackpotDisplay">₩10,000,000</div>
    </div>

    <div class="screen">
      <div class="reels-container" id="reelsContainer">
        <div class="reel" id="reel0"><div class="reel-strip"></div></div>
        <div class="reel" id="reel1"><div class="reel-strip"></div></div>
        <div class="reel" id="reel2"><div class="reel-strip"></div></div>
        <div class="reel" id="reel3"><div class="reel-strip"></div></div>
        <div class="reel" id="reel4"><div class="reel-strip"></div></div>
      </div>

      <div class="win-display" id="winDisplay">🎰 베팅하고 스핀하세요!</div>

      <div class="info-bar">
        <div class="info-item">💰 잔액: <span id="balanceDisplay">₩1,000,000</span></div>
        <div class="bet-controls">
          <button class="bet-btn" id="betDown">−</button>
          <span class="bet-amount" id="betDisplay">₩1,000</span>
          <button class="bet-btn" id="betUp">+</button>
          <button class="bet-btn" id="maxBet" style="font-size:0.7rem;width:auto;border-radius:15px;padding:0 10px;">MAX</button>
        </div>
        <div class="info-item" id="freeSpinsBadge" style="display:none;">
          <span class="feature-badge">🔄 프리스핀 <span id="freeSpinsCount">0</span></span>
        </div>
      </div>
    </div>

    <button class="spin-btn" id="spinBtn">🎰 SPIN</button>
    <div style="text-align:center;margin-top:6px;font-size:0.65rem;color:#555;">
      🍒 체리 x3 = 5x | 💎 다이아 x3 = 20x | 7️⃣ 7 x3 = 50x | 🎰 7-7-7-7-7 = JACKPOT
    </div>
  </div>

  <script>
    (() => {
      // ==================== 심볼 정의 ====================
      const SYMBOLS = [
        { id: 'cherry', icon: '🍒', name: '체리', payout3: 5, payout4: 15, payout5: 30 },
        { id: 'lemon', icon: '🍋', name: '레몬', payout3: 3, payout4: 8, payout5: 15 },
        { id: 'orange', icon: '🍊', name: '오렌지', payout3: 4, payout4: 10, payout5: 20 },
        { id: 'plum', icon: '🫐', name: '자두', payout3: 4, payout4: 10, payout5: 20 },
        { id: 'grape', icon: '🍇', name: '포도', payout3: 6, payout4: 18, payout5: 35 },
        { id: 'bell', icon: '🔔', name: '벨', payout3: 8, payout4: 25, payout5: 50 },
        { id: 'diamond', icon: '💎', name: '다이아', payout3: 20, payout4: 60, payout5: 150 },
        { id: 'seven', icon: '7️⃣', name: '세븐', payout3: 50, payout4: 200, payout5: 500 },
        { id: 'wild', icon: '🌟', name: '와일드', payout3: 100, payout4: 500, payout5: 2000 },
      ];

      const REEL_STRIPS = [
        ['cherry','lemon','orange','plum','grape','bell','diamond','seven','cherry','lemon','orange','plum','grape','bell','diamond','seven','cherry','lemon','orange','plum','grape','bell','diamond','seven','wild'],
        ['lemon','orange','plum','grape','bell','diamond','seven','cherry','lemon','orange','plum','grape','bell','diamond','seven','cherry','lemon','orange','plum','grape','bell','diamond','seven','cherry','wild'],
        ['orange','plum','grape','bell','diamond','seven','cherry','lemon','orange','plum','grape','bell','diamond','seven','cherry','lemon','orange','plum','grape','bell','diamond','seven','cherry','lemon','wild'],
        ['plum','grape','bell','diamond','seven','cherry','lemon','orange','plum','grape','bell','diamond','seven','cherry','lemon','orange','plum','grape','bell','diamond','seven','cherry','lemon','orange'],
        ['grape','bell','diamond','seven','cherry','lemon','orange','plum','grape','bell','diamond','seven','cherry','lemon','orange','plum','grape','bell','diamond','seven','cherry','lemon','orange','plum','grape'],
      ];

      // ==================== 상태 ====================
      let balance = 1000000;
      let betAmount = 1000;
      let jackpot = 10000000;
      let isSpinning = false;
      let freeSpinsRemaining = 0;
      let reelPositions = [0, 0, 0, 0, 0];
      let reelResults = [null, null, null, null, null];
      const betOptions = [500, 1000, 2000, 5000, 10000, 20000, 50000];

      // ==================== DOM ====================
      const reelsContainer = document.getElementById('reelsContainer');
      const winDisplay = document.getElementById('winDisplay');
      const spinBtn = document.getElementById('spinBtn');
      const balanceDisplay = document.getElementById('balanceDisplay');
      const betDisplay = document.getElementById('betDisplay');
      const jackpotDisplay = document.getElementById('jackpotDisplay');
      const freeSpinsBadge = document.getElementById('freeSpinsBadge');
      const freeSpinsCount = document.getElementById('freeSpinsCount');
      const particlesArea = document.getElementById('particlesArea');

      // ==================== 초기화 ====================
      function initReels() {
        for (let i = 0; i < 5; i++) {
          const strip = document.getElementById('reel' + i).querySelector('.reel-strip');
          strip.innerHTML = '';
          for (let j = 0; j < REEL_STRIPS[i].length; j++) {
            const symId = REEL_STRIPS[i][j];
            const sym = SYMBOLS.find(s => s.id === symId);
            const div = document.createElement('div');
            div.className = 'symbol';
            div.textContent = sym.icon;
            div.dataset.symId = symId;
            strip.appendChild(div);
          }
          reelPositions[i] = Math.floor(Math.random() * REEL_STRIPS[i].length);
          updateReelPosition(i, false);
        }
      }

      function updateReelPosition(index, animate = true) {
        const reel = document.getElementById('reel' + index);
        const strip = reel.querySelector('.reel-strip');
        const symHeight = 80;
        const offset = -reelPositions[index] * symHeight;

        if (!animate) {
          strip.style.transition = 'none';
          strip.style.transform = `translateY(${offset}px)`;
          strip.offsetHeight;
          strip.style.transition = '';
        } else {
          strip.style.transform = `translateY(${offset}px)`;
        }
      }

      function getVisibleSymbol(reelIndex, rowOffset = 0) {
        const stripLen = REEL_STRIPS[reelIndex].length;
        const idx = ((reelPositions[reelIndex] + rowOffset) % stripLen + stripLen) % stripLen;
        return REEL_STRIPS[reelIndex][idx];
      }

      // ==================== 스핀 ====================
      function spin() {
        if (isSpinning) return;
        if (freeSpinsRemaining <= 0 && balance < betAmount) {
          showWinMessage('💰 잔액이 부족합니다!');
          return;
        }

        if (freeSpinsRemaining <= 0) {
          balance -= betAmount;
          jackpot += Math.floor(betAmount * 0.1);
        } else {
          freeSpinsRemaining--;
          if (freeSpinsRemaining <= 0) {
            freeSpinsBadge.style.display = 'none';
          }
          freeSpinsCount.textContent = freeSpinsRemaining;
        }

        isSpinning = true;
        spinBtn.disabled = true;
        winDisplay.textContent = '🎰 스핀 중...';
        winDisplay.className = 'win-display';
        reelResults = [null, null, null, null, null];

        // 릴 애니메이션
        const spinDurations = [800, 1000, 1200, 1400, 1600];
        const targetPositions = [];

        for (let i = 0; i < 5; i++) {
          const reel = document.getElementById('reel' + i);
          reel.classList.add('spinning');

          const currentPos = reelPositions[i];
          const extraSpins = 3 + Math.floor(Math.random() * 4);
          targetPositions[i] = currentPos + extraSpins * REEL_STRIPS[i].length + Math.floor(Math.random() * REEL_STRIPS[i].length);

          reelPositions[i] = targetPositions[i] % REEL_STRIPS[i].length;
          updateReelPosition(i, true);

          setTimeout(() => {
            reel.classList.remove('spinning');
            reel.classList.add('stopping');
            reelResults[i] = getVisibleSymbol(i, 1);

            if (i === 4) {
              setTimeout(() => {
                for (let j = 0; j < 5; j++) {
                  document.getElementById('reel' + j).classList.remove('stopping');
                }
                checkWins();
              }, 600);
            }
          }, spinDurations[i]);
        }

        updateDisplay();
      }

      // ==================== 당첨 체크 ====================
      function checkWins() {
        const centerSymbols = [];
        for (let i = 0; i < 5; i++) {
          centerSymbols.push(getVisibleSymbol(i, 1));
        }

        // 와일드 처리
        const effectiveSymbols = centerSymbols.map(s => s);

        // 잭팟: 5개 모두 세븐 또는 와일드
        const allSevenOrWild = effectiveSymbols.every(s => s === 'seven' || s === 'wild');
        if (allSevenOrWild) {
          triggerJackpot();
          return;
        }

        // 5개 매칭
        const match5 = getConsecutiveMatch(effectiveSymbols, 5);
        if (match5) {
          const sym = SYMBOLS.find(s => s.id === match5);
          const payout = sym.payout5 * betAmount;
          addWinnings(payout, `5 ${sym.name}! ${payout.toLocaleString()}원`);
          spawnCoins(30);
          return;
        }

        // 4개 매칭
        for (let start = 0; start <= 1; start++) {
          const subset = effectiveSymbols.slice(start, start + 4);
          const match4 = getConsecutiveMatch(subset, 4);
          if (match4) {
            const sym = SYMBOLS.find(s => s.id === match4);
            const payout = sym.payout4 * betAmount;
            addWinnings(payout, `4 ${sym.name}! ${payout.toLocaleString()}원`);
            spawnCoins(20);
            return;
          }
        }

        // 3개 매칭
        let totalWin = 0;
        let winMessages = [];
        for (let start = 0; start <= 2; start++) {
          const subset = effectiveSymbols.slice(start, start + 3);
          const match3 = getConsecutiveMatch(subset, 3);
          if (match3) {
            const sym = SYMBOLS.find(s => s.id === match3);
            const payout = sym.payout3 * betAmount;
            totalWin += payout;
            winMessages.push(`3 ${sym.name}!`);
          }
        }

        if (totalWin > 0) {
          addWinnings(totalWin, winMessages.join(' | ') + ` ${totalWin.toLocaleString()}원`);
          spawnCoins(12);
        } else {
          // 프리스핀 트리거 (산발된 다이아 3개)
          const diamondCount = centerSymbols.filter(s => s === 'diamond').length;
          if (diamondCount >= 3) {
            triggerFreeSpins(5 + diamondCount * 3);
          } else {
            winDisplay.textContent = '😔 다음 기회에...';
            winDisplay.className = 'win-display';
          }
        }

        finishSpin();
      }

      function getConsecutiveMatch(symbols, count) {
        for (let start = 0; start <= symbols.length - count; start++) {
          const subset = symbols.slice(start, start + count);
          const baseSymbol = subset[0];
          if (baseSymbol === 'wild') continue;
          const allMatch = subset.every(s => s === baseSymbol || s === 'wild');
          if (allMatch && baseSymbol !== 'wild') return baseSymbol;
        }
        return null;
      }

      function triggerJackpot() {
        const win = jackpot;
        balance += win;
        jackpot = 5000000;

        const overlay = document.createElement('div');
        overlay.className = 'jackpot-overlay';
        overlay.innerHTML = `
          <div class="jackpot-text">🎰 JACKPOT! 🎰</div>
          <div style="font-size:2rem;color:#fff;">${win.toLocaleString()}원 당첨!</div>
          <button style="padding:12px 30px;margin-top:20px;font-size:1.2rem;border-radius:30px;background:#ffd700;border:none;cursor:pointer;font-weight:bold;" 
                  onclick="this.parentElement.parentElement.remove()">🎉 확인</button>
        `;
        document.body.appendChild(overlay);

        spawnCoins(50);
        spawnConfetti();
        winDisplay.textContent = `🎰 JACKPOT! ${win.toLocaleString()}원`;
        winDisplay.className = 'win-display bigwin';

        updateDisplay();
        finishSpin();
      }

      function triggerFreeSpins(count) {
        freeSpinsRemaining += count;
        freeSpinsBadge.style.display = 'inline-block';
        freeSpinsCount.textContent = freeSpinsRemaining;
        winDisplay.textContent = `🔄 프리스핀 ${count}회 획득!`;
        winDisplay.className = 'win-display';
        spawnCoins(15);
        finishSpin();
      }

      function addWinnings(amount, message) {
        balance += amount;
        winDisplay.textContent = '🎉 ' + message;
        if (amount >= betAmount * 50) {
          winDisplay.className = 'win-display bigwin';
          spawnConfetti();
        } else {
          winDisplay.className = 'win-display';
        }
        updateDisplay();
      }

      function finishSpin() {
        isSpinning = false;
        spinBtn.disabled = false;
        updateDisplay();
      }

      // ==================== 이펙트 ====================
      function spawnCoins(count) {
        for (let i = 0; i < count; i++) {
          setTimeout(() => {
            const coin = document.createElement('span');
            coin.className = 'coin-particle';
            coin.textContent = ['💰', '🪙', '💎', '✨'][Math.floor(Math.random() * 4)];
            coin.style.left = Math.random() * 100 + '%';
            coin.style.animationDelay = '0s';
            coin.style.animationDuration = (1.5 + Math.random() * 2) + 's';
            particlesArea.appendChild(coin);
            setTimeout(() => coin.remove(), 3000);
          }, i * 60);
        }
      }

      function spawnConfetti() {
        const colors = ['🎉', '🎊', '✨', '💫', '🌟', '💥'];
        for (let i = 0; i < 40; i++) {
          const piece = document.createElement('span');
          piece.style.cssText = `
            position: fixed;
            pointer-events: none;
            z-index: 998;
            font-size: ${1.5 + Math.random() * 2}rem;
            left: ${Math.random() * 100}%;
            top: -50px;
            animation: confettiFall ${2 + Math.random() * 3}s forwards;
            animation-delay: ${Math.random() * 1}s;
          `;
          piece.textContent = colors[Math.floor(Math.random() * colors.length)];
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 4000);
        }
      }

      function showWinMessage(msg) {
        winDisplay.textContent = msg;
        winDisplay.className = 'win-display';
      }

      // ==================== UI 업데이트 ====================
      function updateDisplay() {
        balanceDisplay.textContent = '₩' + balance.toLocaleString();
        betDisplay.textContent = '₩' + betAmount.toLocaleString();
        jackpotDisplay.textContent = '₩' + jackpot.toLocaleString();
        spinBtn.textContent = freeSpinsRemaining > 0 ?
          `🎰 FREE SPIN (${freeSpinsRemaining})` : '🎰 SPIN';
      }

      function changeBet(direction) {
        if (isSpinning) return;
        const currentIdx = betOptions.indexOf(betAmount);
        let newIdx = currentIdx + direction;
        if (newIdx < 0) newIdx = betOptions.length - 1;
        if (newIdx >= betOptions.length) newIdx = 0;
        betAmount = betOptions[newIdx];
        updateDisplay();
      }

      function setMaxBet() {
        if (isSpinning) return;
        betAmount = betOptions[betOptions.length - 1];
        if (betAmount > balance && freeSpinsRemaining <= 0) {
          betAmount = betOptions.find(b => b <= balance) || betOptions[0];
        }
        updateDisplay();
      }

      // ==================== 이벤트 ====================
      document.getElementById('spinBtn').addEventListener('click', spin);
      document.getElementById('betUp').addEventListener('click', () => changeBet(1));
      document.getElementById('betDown').addEventListener('click', () => changeBet(-1));
      document.getElementById('maxBet').addEventListener('click', setMaxBet);

      // 키보드 스페이스바로 스핀
      document.addEventListener('keydown', e => {
        if (e.code === 'Space' && !isSpinning) {
          e.preventDefault();
          spin();
        }
      });

      // ==================== 시작 ====================
      initReels();
      updateDisplay();
      winDisplay.textContent = '🎰 스핀을 눌러 시작하세요!';
      console.log('🎰 마카오 골드 슬롯 준비 완료!');
      console.log('🕹️ SPIN 버튼 또는 스페이스바로 플레이!');
    })();
  </script>
</body>
</html>

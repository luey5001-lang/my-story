<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>⚔️ 가챠 RPG - 어둠의 소환사</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0c14;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      background-image: radial-gradient(circle at 20% 20%, #1a1f35, #03050a);
    }
    .game-wrapper {
      max-width: 700px;
      width: 100%;
      background: linear-gradient(145deg, #1e2130, #12141e);
      border-radius: 32px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
      border: 1px solid #4a3f6b;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .currency-box {
      background: #2a1f3a;
      border-radius: 40px;
      padding: 10px 22px;
      display: flex;
      gap: 25px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.7);
      border: 1px solid #7a5fa0;
    }
    .currency {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #f3e3c9;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .currency span {
      color: #ffd966;
    }
    .btn {
      background: #3b2d5c;
      border: none;
      color: #f0e6d2;
      font-weight: bold;
      padding: 10px 22px;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
      border-bottom: 3px solid #1f1535;
      letter-spacing: 0.5px;
    }
    .btn:active {
      transform: translateY(2px);
      border-bottom-width: 1px;
    }
    .btn.gold {
      background: #c49b4a;
      border-color: #6b4c1e;
      color: #1e1408;
    }
    .btn.danger {
      background: #5c2d3a;
      border-color: #2f111a;
    }
    .gacha-area {
      background: #1b1628;
      border-radius: 28px;
      padding: 20px;
      margin: 18px 0;
      text-align: center;
      border: 1px solid #5e4a7c;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
    }
    .gacha-title {
      color: #cfbcff;
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .pull-buttons {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .pull-btn {
      background: #9b59b6;
      border: none;
      color: white;
      font-weight: bold;
      font-size: 1.2rem;
      padding: 12px 28px;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
      box-shadow: 0 6px 0 #5b2c6e;
      border: 1px solid #d7a1f0;
    }
    .pull-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #5b2c6e;
    }
    .pull-btn.ten {
      background: #e67e22;
      box-shadow: 0 6px 0 #b85e0c;
      border-color: #f5b041;
    }
    .roster {
      background: #171b26;
      border-radius: 24px;
      padding: 15px;
      margin-top: 20px;
      border: 1px solid #4a5568;
    }
    .roster h3 {
      color: #d4c8a8;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .character-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 6px;
    }
    .char-card {
      background: #252a3a;
      border-radius: 18px;
      padding: 10px;
      width: 85px;
      text-align: center;
      border: 2px solid #4d3b6b;
      transition: 0.2s;
      position: relative;
    }
    .char-card.ssr {
      border-color: #f1c40f;
      box-shadow: 0 0 15px #f39c12;
      background: #2f2a1c;
    }
    .char-icon {
      font-size: 2.5rem;
      filter: drop-shadow(0 4px 4px black);
    }
    .char-name {
      font-weight: bold;
      color: #ddd;
      font-size: 0.8rem;
      margin-top: 4px;
    }
    .char-level {
      color: #a0b0c0;
      font-size: 0.7rem;
    }
    .upgrade-btn {
      background: #2e4053;
      border: none;
      color: white;
      border-radius: 20px;
      padding: 4px 8px;
      font-size: 0.65rem;
      margin-top: 5px;
      cursor: pointer;
    }
    .result-log {
      background: #0b0e14;
      border-radius: 16px;
      padding: 10px;
      margin: 12px 0;
      color: #b9c7dd;
      font-size: 0.9rem;
      max-height: 80px;
      overflow-y: auto;
      border: 1px solid #3c4455;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #2d2d3a;
      border-radius: 10px;
      margin: 8px 0;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: #c99c2b;
      transition: width 0.2s;
    }
    @media (max-width: 500px) {
      .char-card {
        width: 70px;
      }
    }
  </style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <div class="currency-box">
      <div class="currency">💎 <span id="gemAmount">500</span></div>
      <div class="currency">🪙 <span id="goldAmount">200</span></div>
    </div>
    <button class="btn" id="addResourcesBtn">✨ 무료 재화</button>
  </div>

  <div class="gacha-area">
    <div class="gacha-title">🌑 차원의 소환</div>
    <div class="progress-bar">
      <div class="progress-fill" id="pityProgress"></div>
    </div>
    <p style="color:#b9a5d6; margin:6px 0;">SSR 확률 5% | ⭐5 천장까지 <span id="pityCounter">0</span>/90</p>
    <div class="pull-buttons">
      <button class="pull-btn" id="pullOneBtn">🔮 1회 소환 (50💎)</button>
      <button class="pull-btn ten" id="pullTenBtn">🌟 10연차 (450💎)</button>
    </div>
    <div class="result-log" id="resultLog">✨ 소환 결과가 여기에 표시됩니다.</div>
  </div>

  <div class="roster">
    <h3>📜 내 캐릭터 목록 <span style="font-size:0.8rem; color:#8e99aa;">(클릭 후 강화)</span></h3>
    <div class="character-grid" id="characterList"></div>
  </div>
  <div style="display:flex; justify-content:space-between; margin-top:12px;">
    <button class="btn danger" id="resetGameBtn">🗑️ 데이터 초기화</button>
    <span style="color:#7f8c9b;">보유 캐릭터: <span id="ownedCount">0</span></span>
  </div>
</div>

<script>
  (() => {
    // ---------- 게임 상태 ----------
    const state = {
      gem: 500,
      gold: 200,
      pityCounter: 0,        // 현재 천장 카운트 (최대 90)
      characters: [],        // { id, name, rarity, level, icon }
    };

    // 캐릭터 데이터베이스
    const characterPool = {
      SSR: [
        { name: '어둠의 기사 레온', icon: '🗡️🛡️' },
        { name: '대마법사 세라피나', icon: '🔮✨' },
        { name: '용기사 카이', icon: '🐉⚔️' },
        { name: '그림자 암살자 제로', icon: '🥷🌑' },
        { name: '성스러운 여왕 엘레나', icon: '👑🌟' },
      ],
      SR: [
        { name: '정령 궁수 리나', icon: '🏹🍃' },
        { name: '도적 단테', icon: '🗡️💨' },
        { name: '마법검사 아렌', icon: '⚡🗡️' },
        { name: '성기사 토마스', icon: '🛡️✝️' },
        { name: '흑마법사 모르간', icon: '💀📖' },
      ],
      R: [
        { name: '모험가 켄', icon: '⚔️🛡️' },
        { name: '수습마법사 루나', icon: '📘✨' },
        { name: '병사 잭', icon: '🗡️' },
        { name: '궁수 엘리', icon: '🏹' },
      ]
    };

    // DOM 요소
    const gemSpan = document.getElementById('gemAmount');
    const goldSpan = document.getElementById('goldAmount');
    const pityProgress = document.getElementById('pityProgress');
    const pityCounterSpan = document.getElementById('pityCounter');
    const resultLog = document.getElementById('resultLog');
    const characterListDiv = document.getElementById('characterList');
    const ownedCountSpan = document.getElementById('ownedCount');

    // ---------- 유틸 ----------
    function saveGame() {
      localStorage.setItem('gachaRpgSave', JSON.stringify(state));
    }
    function loadGame() {
      const saved = localStorage.getItem('gachaRpgSave');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state.gem = parsed.gem ?? 500;
          state.gold = parsed.gold ?? 200;
          state.pityCounter = parsed.pityCounter ?? 0;
          state.characters = parsed.characters ?? [];
        } catch (e) {}
      }
    }

    function updateUI() {
      gemSpan.textContent = state.gem;
      goldSpan.textContent = state.gold;
      const progressPercent = Math.min(100, (state.pityCounter / 90) * 100);
      pityProgress.style.width = `${progressPercent}%`;
      pityCounterSpan.textContent = state.pityCounter;
      ownedCountSpan.textContent = state.characters.length;
      renderCharacterList();
      saveGame();
    }

    function addLog(message) {
      resultLog.innerHTML = message + '<br>' + resultLog.innerHTML;
      resultLog.scrollTop = 0;
    }

    // ---------- 가챠 로직 ----------
    function performPull(isTenPull = false) {
      const cost = isTenPull ? 450 : 50;
      if (state.gem < cost) {
        addLog('❌ 다이아가 부족합니다!');
        return;
      }
      state.gem -= cost;
      const pulls = isTenPull ? 10 : 1;
      const results = [];

      for (let i = 0; i < pulls; i++) {
        state.pityCounter++;
        let rarity = 'R';
        const rand = Math.random() * 100;

        // SSR 확률 5% , 천장 90 도달 시 확정 SSR
        if (state.pityCounter >= 90 || rand < 5) {
          rarity = 'SSR';
          state.pityCounter = 0; // 천장 리셋
        } else if (rand < 20) { // SR 15% 추가 (5%+15% =20%)
          rarity = 'SR';
        }

        // 해당 레어리티에서 랜덤 캐릭터 선택
        const pool = characterPool[rarity];
        const charData = pool[Math.floor(Math.random() * pool.length)];
        
        // 캐릭터 객체 생성
        const newChar = {
          id: Date.now() + Math.random() + i,
          name: charData.name,
          rarity: rarity,
          level: 1,
          icon: charData.icon,
        };
        state.characters.push(newChar);
        results.push({ name: charData.name, rarity, icon: charData.icon });
      }

      // 결과 로그 표시
      const ssrResults = results.filter(r => r.rarity === 'SSR');
      const srResults = results.filter(r => r.rarity === 'SR');
      let logMsg = '';
      if (ssrResults.length > 0) {
        logMsg += `🌟SSR 획득! ${ssrResults.map(c=>c.icon+c.name).join(', ')} `;
      }
      if (srResults.length > 0) {
        logMsg += `✨SR: ${srResults.map(c=>c.name).join(', ')} `;
      }
      if (results.length > 2) logMsg += `외 ${results.length - ssrResults.length - srResults.length}명`;
      addLog(logMsg || '🟢 R 캐릭터 획득');
      updateUI();
    }

    // ---------- 캐릭터 강화 ----------
    function upgradeCharacter(charId) {
      const char = state.characters.find(c => c.id === charId);
      if (!char) return;
      const cost = char.level * 35 + 20;
      if (state.gold < cost) {
        addLog('💰 골드가 부족합니다!');
        return;
      }
      state.gold -= cost;
      char.level += 1;
      addLog(`⬆️ ${char.icon} ${char.name} Lv.${char.level} 강화 완료!`);
      updateUI();
    }

    // ---------- 렌더링 ----------
    function renderCharacterList() {
      if (!characterListDiv) return;
      // 레어리티 순 정렬 SSR > SR > R
      const sorted = [...state.characters].sort((a,b) => {
        const order = {SSR:3, SR:2, R:1};
        return (order[b.rarity]||0) - (order[a.rarity]||0);
      });
      characterListDiv.innerHTML = '';
      if (sorted.length === 0) {
        characterListDiv.innerHTML = '<p style="color:#6f7a8a; padding:12px;">아직 캐릭터가 없습니다. 소환해주세요!</p>';
        return;
      }
      sorted.forEach(char => {
        const card = document.createElement('div');
        card.className = `char-card ${char.rarity === 'SSR' ? 'ssr' : ''}`;
        card.innerHTML = `
          <div class="char-icon">${char.icon}</div>
          <div class="char-name">${char.name}</div>
          <div class="char-level">Lv.${char.level}</div>
          <button class="upgrade-btn">🔧 강화</button>
        `;
        card.querySelector('.upgrade-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          upgradeCharacter(char.id);
        });
        characterListDiv.appendChild(card);
      });
    }

    // ---------- 이벤트 연결 ----------
    document.getElementById('pullOneBtn').addEventListener('click', () => performPull(false));
    document.getElementById('pullTenBtn').addEventListener('click', () => performPull(true));

    document.getElementById('addResourcesBtn').addEventListener('click', () => {
      state.gem += 300;
      state.gold += 500;
      addLog('✨ 무료 재화 지급! +300💎 +500🪙');
      updateUI();
    });

    document.getElementById('resetGameBtn').addEventListener('click', () => {
      if (confirm('정말 모든 데이터를 초기화하시겠습니까? 보유 캐릭터와 재화가 사라집니다.')) {
        localStorage.removeItem('gachaRpgSave');
        state.gem = 500;
        state.gold = 200;
        state.pityCounter = 0;
        state.characters = [];
        updateUI();
        addLog('🗑️ 데이터가 초기화되었습니다.');
      }
    });

    // 초기화
    loadGame();
    updateUI();
    addLog('⚔️ 어둠의 소환사에 오신 것을 환영합니다!');
  })();
</script>
</body>
</html>

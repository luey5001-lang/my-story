<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🌟 스타 카드 마스터 - 홀로그램 가챠</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: radial-gradient(ellipse at center, #0a0a1a 0%, #050510 100%);
      min-height: 100vh;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      color: #fff;
      display: flex;
      justify-content: center;
      padding: 10px;
      overflow-x: hidden;
    }
    .app { max-width: 750px; width: 100%; position: relative; }

    /* ========== 글로벌 이펙트 ========== */
    .particles-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 200;
    }
    .spark {
      position: absolute;
      pointer-events: none;
      animation: sparkFly 1.2s forwards;
      font-size: 1.5rem;
      z-index: 201;
    }
    @keyframes sparkFly {
      0% { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
    }
    .confetti-piece {
      position: fixed;
      pointer-events: none;
      z-index: 199;
      animation: confettiFall 2.5s forwards;
      font-size: 1.8rem;
    }
    @keyframes confettiFall {
      0% { opacity: 1; transform: translateY(-120vh) rotate(0deg) scale(1); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateY(110vh) rotate(720deg) scale(0.3); }
    }
    .screen-shake {
      animation: screenShake 0.6s ease-out;
    }
    @keyframes screenShake {
      0%,100% { transform: translate(0); }
      10% { transform: translate(-6px, 3px); }
      30% { transform: translate(5px, -4px); }
      50% { transform: translate(-3px, 6px); }
      70% { transform: translate(4px, -2px); }
      90% { transform: translate(-2px, 1px); }
    }

    /* ========== 헤더 ========== */
    .header {
      background: linear-gradient(135deg, #1a1a3a, #2a2a5a);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border: 1px solid #4a4a8a;
      margin-bottom: 10px;
    }
    .resources { display: flex; gap: 16px; flex-wrap: wrap; }
    .resource { display: flex; align-items: center; gap: 6px; font-weight: bold; font-size: 0.95rem; }
    .resource span { color: #ffd700; }
    .level-badge {
      background: linear-gradient(135deg, #c9a44b, #8b6914);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
    .tab {
      padding: 10px 16px;
      background: #2a2a4a;
      border: 1px solid #4a4a7a;
      border-radius: 10px 10px 0 0;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
      transition: 0.2s;
      color: #aaa;
    }
    .tab.active { background: #3a3a6a; color: #ffd700; border-color: #c9a44b; }
    .content {
      background: #1a1a3a;
      border-radius: 0 0 16px 16px;
      padding: 16px;
      min-height: 450px;
      border: 1px solid #4a4a8a;
      border-top: none;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ========== 가챠 ========== */
    .gacha-banner {
      text-align: center;
      padding: 20px;
      background: linear-gradient(135deg, #2a1a4a, #1a2a4a);
      border-radius: 16px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
    }
    .gacha-banner::before {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(255,215,0,0.08), transparent, rgba(255,136,0,0.08), transparent);
      animation: rotateBg 8s linear infinite;
    }
    @keyframes rotateBg {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .gacha-title { font-size: 1.5rem; font-weight: bold; color: #ffd700; margin-bottom: 6px; position: relative; z-index: 1; }
    .gacha-card-preview {
      position: relative;
      z-index: 1;
      display: inline-block;
      width: 140px;
      height: 200px;
      margin: 10px;
      perspective: 800px;
    }
    .holo-card {
      width: 100%;
      height: 100%;
      border-radius: 14px;
      background: linear-gradient(135deg, #1a1a4a, #2a2a6a, #1a1a4a);
      border: 3px solid #c9a44b;
      position: relative;
      overflow: hidden;
      animation: floatCard 3s ease-in-out infinite;
      box-shadow: 0 0 30px rgba(201,164,75,0.5), 0 0 60px rgba(201,164,75,0.2);
      transform-style: preserve-3d;
    }
    @keyframes floatCard {
      0%,100% { transform: translateY(0) rotateY(0deg); }
      25% { transform: translateY(-8px) rotateY(2deg); }
      75% { transform: translateY(-4px) rotateY(-2deg); }
    }
    .holo-card::before {
      content: '';
      position: absolute;
      inset: -50%;
      background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.15), transparent, rgba(255,215,0,0.2), transparent);
      animation: holoSpin 3s linear infinite;
    }
    @keyframes holoSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .holo-card-inner {
      position: absolute;
      inset: 4px;
      border-radius: 10px;
      background: radial-gradient(circle at 50% 50%, #2a2a5a, #0a0a2a);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }
    .holo-question {
      font-size: 4rem;
      color: #ffd700;
      text-shadow: 0 0 30px #ffd700;
      animation: pulseGlow 1.5s infinite;
    }
    @keyframes pulseGlow {
      0%,100% { text-shadow: 0 0 20px #ffd700; }
      50% { text-shadow: 0 0 50px #ffd700, 0 0 80px #f80; }
    }
    .gacha-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 12px; position: relative; z-index: 1; }
    .gacha-btn {
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      color: #fff;
      font-size: 1rem;
      transition: 0.2s;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
      position: relative;
      overflow: hidden;
    }
    .gacha-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); }
    .gacha-btn::after {
      content: '';
      position: absolute;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .gacha-btn:hover::after { opacity: 1; }
    .btn-single { background: #4a4a8a; }
    .btn-ten { background: #c9a44b; color: #000; animation: btnGlow 2s infinite; }
    @keyframes btnGlow {
      0%,100% { box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 0 15px #c9a44b; }
      50% { box-shadow: 0 4px 0 rgba(0,0,0,0.3), 0 0 35px #ffd700; }
    }
    .gacha-result {
      margin-top: 12px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 0.85rem;
      position: relative;
      z-index: 1;
    }
    .result-card-line {
      display: inline-block;
      padding: 4px 10px;
      margin: 2px;
      border-radius: 12px;
      animation: popIn 0.4s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      70% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }
    .legendary-bg { background: linear-gradient(135deg, #f80, #f40); color: #fff; text-shadow: 0 0 10px #fff; }
    .epic-bg { background: linear-gradient(135deg, #a0f, #60c); color: #fff; }
    .rare-bg { background: linear-gradient(135deg, #4af, #28c); color: #fff; }
    .common-bg { background: #555; color: #ccc; }

    /* ========== 컬렉션 ========== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 10px;
      max-height: 400px;
      overflow-y: auto;
      padding: 5px;
    }
    .card-item {
      background: linear-gradient(135deg, #2a2a4a, #1a1a3a);
      border-radius: 10px;
      padding: 8px;
      text-align: center;
      border: 2px solid #4a4a7a;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
      overflow: hidden;
    }
    .card-item:hover { border-color: #c9a44b; transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.5); }
    .card-item.legendary {
      border-color: #ff8800;
      animation: legendaryGlow 2s infinite;
    }
    .card-item.legendary::after {
      content: '';
      position: absolute;
      inset: -20px;
      background: conic-gradient(from 0deg, transparent, rgba(255,136,0,0.2), transparent, rgba(255,200,0,0.2), transparent);
      animation: holoSpin 4s linear infinite;
    }
    @keyframes legendaryGlow {
      0%,100% { box-shadow: 0 0 20px rgba(255,136,0,0.5); }
      50% { box-shadow: 0 0 50px rgba(255,136,0,0.9); }
    }
    .card-item .icon { font-size: 2.5rem; position: relative; z-index: 1; }
    .card-item .name { font-weight: bold; font-size: 0.8rem; margin: 4px 0; position: relative; z-index: 1; }
    .card-item .rarity {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 8px;
      display: inline-block;
      position: relative;
      z-index: 1;
    }
    .rarity-common { background: #888; color: #fff; }
    .rarity-rare { background: #4af; color: #fff; }
    .rarity-epic { background: #a0f; color: #fff; }
    .rarity-legendary { background: #f80; color: #fff; animation: pulse 1s infinite; }
    @keyframes pulse {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .card-item .level { font-size: 0.7rem; color: #aaa; position: relative; z-index: 1; }
    .card-count {
      position: absolute;
      top: 5px; right: 8px;
      background: #000;
      color: #ffd700;
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 10px;
      z-index: 2;
    }

    /* ========== 상점 ========== */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }
    .shop-item {
      background: #2a2a4a;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      border: 2px solid #4a4a7a;
      transition: 0.2s;
    }
    .shop-item:hover { border-color: #c9a44b; }
    .shop-item button {
      margin-top: 8px;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      border: none;
      font-weight: bold;
      background: #c9a44b;
      color: #000;
      font-size: 0.8rem;
    }

    /* ========== 퀘스트 ========== */
    .quest-list { display: flex; flex-direction: column; gap: 8px; }
    .quest-item {
      background: #2a2a4a;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #4a4a7a;
      flex-wrap: wrap;
      gap: 8px;
    }
    .quest-item button {
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      border: none;
      font-weight: bold;
      background: #3a8b5a;
      color: #fff;
      font-size: 0.8rem;
    }
    .quest-item button:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-bar { width: 100%; height: 6px; background: #3a3a5a; border-radius: 3px; margin-top: 4px; overflow: hidden; }
    .progress-fill { height: 100%; background: #ffd700; transition: width 0.3s; }

    /* ========== 덱 ========== */
    .deck-area { display: flex; gap: 10px; flex-wrap: wrap; }
    .deck-slot {
      width: 80px;
      height: 110px;
      border: 2px dashed #4a4a7a;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.7rem;
      text-align: center;
      transition: 0.2s;
    }
    .deck-slot.filled { border: 2px solid #c9a44b; background: #2a2a4a; }
    .deck-slot:hover { border-color: #ffd700; }

    /* ========== 모달 ========== */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: linear-gradient(135deg, #2a2a5a, #1a1a3a);
      border-radius: 16px;
      padding: 20px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      border: 2px solid #c9a44b;
      animation: modalIn 0.4s ease-out;
    }
    @keyframes modalIn {
      from { transform: scale(0.7); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-content button {
      margin-top: 12px;
      padding: 10px 24px;
      border-radius: 20px;
      cursor: pointer;
      border: none;
      font-weight: bold;
      background: #c9a44b;
      color: #000;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .filter-btn {
      padding: 6px 12px;
      border-radius: 15px;
      border: 1px solid #4a4a7a;
      background: #2a2a4a;
      color: #aaa;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
      transition: 0.2s;
    }
    .filter-btn.active { background: #c9a44b; color: #000; border-color: #c9a44b; }

    @media (max-width: 500px) {
      .card-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
      .gacha-btn { padding: 10px 16px; font-size: 0.85rem; }
      .holo-card { width: 100px; height: 150px; }
      .gacha-card-preview { width: 100px; height: 150px; }
    }
  </style>
</head>
<body>
  <div class="particles-container" id="particlesContainer"></div>

  <div class="app" id="appContainer">
    <div class="header">
      <div class="resources">
        <div class="resource">💎 <span id="gemDisplay">500</span></div>
        <div class="resource">🪙 <span id="goldDisplay">1000</span></div>
        <div class="resource">⭐ <span id="dustDisplay">50</span></div>
        <div class="resource">🎫 <span id="ticketDisplay">0</span></div>
      </div>
      <div class="level-badge">🎖️ Lv.<span id="playerLevel">1</span></div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="gacha">🎴 가챠</div>
      <div class="tab" data-tab="collection">📚 컬렉션</div>
      <div class="tab" data-tab="deck">⚔️ 덱 빌더</div>
      <div class="tab" data-tab="shop">🛒 상점</div>
      <div class="tab" data-tab="quest">📋 퀘스트</div>
    </div>

    <div class="content">
      <div class="tab-content active" id="tab-gacha">
        <div class="gacha-banner">
          <div class="gacha-title">🌟 스타 카드 소환</div>
          <div class="gacha-card-preview">
            <div class="holo-card">
              <div class="holo-card-inner">
                <span class="holo-question">?</span>
                <span style="color:#aaa;font-size:0.7rem;">카드</span>
              </div>
            </div>
          </div>
          <p style="color:#aaa;font-size:0.8rem;position:relative;z-index:1;">전설: 3% | 에픽: 12% | 레어: 35% | 일반: 50%</p>
          <p style="color:#f80;font-size:0.85rem;position:relative;z-index:1;">⭐ 전설 천장까지 <span id="pityCounter">0</span>/80</p>
          <div class="gacha-buttons">
            <button class="gacha-btn btn-single" id="pullOne">🔮 1회 (50💎)</button>
            <button class="gacha-btn btn-ten" id="pullTen">🌟 10+1회 (450💎)</button>
          </div>
          <div class="gacha-result" id="gachaResult"></div>
        </div>
      </div>

      <div class="tab-content" id="tab-collection">
        <div style="margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap;">
          <button class="filter-btn active" data-filter="all">전체</button>
          <button class="filter-btn" data-filter="legendary">⭐전설</button>
          <button class="filter-btn" data-filter="epic">에픽</button>
          <button class="filter-btn" data-filter="rare">레어</button>
          <button class="filter-btn" data-filter="common">일반</button>
        </div>
        <div class="card-grid" id="collectionGrid"></div>
      </div>

      <div class="tab-content" id="tab-deck">
        <h3 style="margin-bottom:10px;">⚔️ 내 덱 (최대 5장)</h3>
        <div class="deck-area" id="deckSlots"></div>
        <p style="color:#aaa;font-size:0.8rem;margin-top:8px;">컬렉션 탭에서 카드를 클릭하여 덱에 추가/제거</p>
        <p style="margin-top:8px;"><strong>덱 파워:</strong> <span id="deckPower">0</span></p>
      </div>

      <div class="tab-content" id="tab-shop">
        <div class="shop-grid">
          <div class="shop-item"><div style="font-size:2rem;">💎</div><strong>300 다이아</strong><p style="color:#aaa;font-size:0.8rem;">무료</p><button id="btnGems300">받기</button></div>
          <div class="shop-item"><div style="font-size:2rem;">🎫</div><strong>티켓 x3</strong><p style="color:#aaa;font-size:0.8rem;">500💰</p><button id="btnTickets3">구매</button></div>
          <div class="shop-item"><div style="font-size:2rem;">⭐</div><strong>진화돌 30</strong><p style="color:#aaa;font-size:0.8rem;">300💰</p><button id="btnDust30">구매</button></div>
          <div class="shop-item"><div style="font-size:2rem;">🪙</div><strong>1000 골드</strong><p style="color:#aaa;font-size:0.8rem;">100💎</p><button id="btnGold1000">구매</button></div>
        </div>
      </div>

      <div class="tab-content" id="tab-quest">
        <div class="quest-list" id="questList"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="modal" style="display:none;">
    <div class="modal-content" id="modalContent"></div>
  </div>

  <script>
    // ==================== 카드 DB ====================
    const CARD_DB = [
      { id: 'c01', name: '불꽃 전사', icon: '⚔️🔥', rarity: 'common', hp: 100, atk: 30, img: '🦁' },
      { id: 'c02', name: '얼음 마법사', icon: '🧊❄️', rarity: 'common', hp: 80, atk: 35, img: '🧙‍♀️' },
      { id: 'c03', name: '바람 궁수', icon: '🏹💨', rarity: 'common', hp: 90, atk: 28, img: '🧝' },
      { id: 'c04', name: '대지 수호자', icon: '🛡️⛰️', rarity: 'common', hp: 130, atk: 18, img: '🛡️' },
      { id: 'c05', name: '번개 검사', icon: '⚡🗡️', rarity: 'rare', hp: 140, atk: 45, img: '⚡' },
      { id: 'c06', name: '그림자 암살자', icon: '🥷🌑', rarity: 'rare', hp: 110, atk: 55, img: '🥷' },
      { id: 'c07', name: '신성한 사제', icon: '✨🙏', rarity: 'rare', hp: 160, atk: 25, img: '🧝‍♂️' },
      { id: 'c08', name: '용기사', icon: '🐉⚔️', rarity: 'epic', hp: 220, atk: 65, img: '🐉' },
      { id: 'c09', name: '대마법사', icon: '🔮🌟', rarity: 'epic', hp: 180, atk: 75, img: '🔮' },
      { id: 'c10', name: '천사장', icon: '👼✨', rarity: 'epic', hp: 250, atk: 55, img: '👼' },
      { id: 'c11', name: '태초의 드래곤', icon: '🐲💥', rarity: 'legendary', hp: 400, atk: 120, img: '🐲' },
      { id: 'c12', name: '시공의 지배자', icon: '⏳🌌', rarity: 'legendary', hp: 350, atk: 140, img: '⏳' },
      { id: 'c13', name: '혼돈의 군주', icon: '👑💀', rarity: 'legendary', hp: 380, atk: 130, img: '👑' },
    ];

    // ==================== 상태 ====================
    let gems = 500, gold = 1000, dust = 50, tickets = 0;
    let pityCount = 0;
    const PITY_MAX = 80;
    let ownedCards = {};
    let deck = [];
    let currentFilter = 'all';
    let quests = [];
    let cardsOpened = 0;

    // ==================== 이펙트 시스템 ====================
    function spawnSparks(x, y, count = 15) {
      const container = document.getElementById('particlesContainer');
      const emojis = ['✨', '💫', '⭐', '🌟', '💥', '🔥', '💎'];
      for (let i = 0; i < count; i++) {
        const spark = document.createElement('span');
        spark.className = 'spark';
        spark.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        spark.style.left = x + 'px';
        spark.style.top = y + 'px';
        spark.style.setProperty('--dx', (Math.random() - 0.5) * 200 + 'px');
        spark.style.setProperty('--dy', (Math.random() - 0.5) * 200 - 50 + 'px');
        spark.style.animationDuration = (0.8 + Math.random() * 1.2) + 's';
        container.appendChild(spark);
        setTimeout(() => spark.remove(), 1500);
      }
    }

    function spawnConfetti() {
      const container = document.getElementById('particlesContainer');
      const emojis = ['🎉', '🎊', '✨', '💎', '🌟', '🃏', '🎴', '💰'];
      for (let i = 0; i < 35; i++) {
        const piece = document.createElement('span');
        piece.className = 'confetti-piece';
        piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        piece.style.left = Math.random() * 100 + '%';
        piece.style.animationDelay = Math.random() * 1.5 + 's';
        piece.style.animationDuration = (2 + Math.random() * 2) + 's';
        container.appendChild(piece);
        setTimeout(() => piece.remove(), 3500);
      }
    }

    function screenShake() {
      const app = document.getElementById('appContainer');
      app.classList.add('screen-shake');
      setTimeout(() => app.classList.remove('screen-shake'), 600);
    }

    // ==================== 함수 ====================
    function addCard(cardId, count = 1) {
      if (!ownedCards[cardId]) ownedCards[cardId] = { count: 0, level: 1 };
      ownedCards[cardId].count += count;
      cardsOpened += count;
    }

    function getCardStats(cardId) {
      const card = CARD_DB.find(c => c.id === cardId);
      if (!card || !ownedCards[cardId]) return { hp: 0, atk: 0, level: 1 };
      const lv = ownedCards[cardId].level;
      return {
        hp: Math.floor(card.hp * (1 + (lv - 1) * 0.2)),
        atk: Math.floor(card.atk * (1 + (lv - 1) * 0.2)),
        level: lv,
      };
    }

    function showModal(msg) {
      document.getElementById('modalContent').innerHTML =
        `<p style="font-size:1.1rem;white-space:pre-line;">${msg}</p>
         <button onclick="document.getElementById('modal').style.display='none'">확인</button>`;
      document.getElementById('modal').style.display = 'flex';
    }

    document.getElementById('modal').addEventListener('click', function(e) {
      if (e.target === this) this.style.display = 'none';
    });

    // ==================== 가챠 ====================
    function pullGacha(times) {
      const actualPulls = times >= 10 ? times + 1 : times;
      let cost = times >= 10 ? 450 : 50 * times;
      if (tickets >= actualPulls) { tickets -= actualPulls;
        cost = 0; } else if (tickets > 0) { const r = actualPulls - tickets;
        cost = r * 50;
        tickets = 0; }
      if (gems < cost && cost > 0) { showModal('❌ 다이아가 부족합니다!'); return; }
      gems -= cost;

      const results = [];
      let gotLegendary = false;
      for (let i = 0; i < actualPulls; i++) {
        pityCount++;
        let rarity;
        const roll = Math.random() * 100;
        if (pityCount >= PITY_MAX || roll < 3) { rarity = 'legendary';
          pityCount = 0;
          gotLegendary = true; } else if (roll < 15) { rarity = 'epic'; } else if (roll < 50) { rarity = 'rare'; } else { rarity =
            'common'; }
        const pool = CARD_DB.filter(c => c.rarity === rarity);
        const card = pool[Math.floor(Math.random() * pool.length)];
        addCard(card.id, 1);
        results.push(card);
      }

      // 이펙트
      screenShake();
      const btn = document.getElementById('pullTen');
      const rect = btn.getBoundingClientRect();
      spawnSparks(rect.left + rect.width / 2, rect.top + rect.height / 2, 25);
      if (gotLegendary) {
        setTimeout(() => spawnConfetti(), 300);
        setTimeout(() => screenShake(), 500);
      }

      updateQuests();
      updateAllUI();
      showGachaResult(results);
      saveGame();
    }

    function showGachaResult(results) {
      const c = document.getElementById('gachaResult');
      const leg = results.filter(r => r.rarity === 'legendary');
      let h = '';
      if (leg.length > 0) h += '<div style="color:#f80;font-size:1.3rem;font-weight:bold;">🌟 전설 카드 획득!!</div>';
      h += '<div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;">';
      h += results.slice(0, 12).map((r, i) => {
        const bg = r.rarity === 'legendary' ? 'legendary-bg' : r.rarity === 'epic' ? 'epic-bg' : r.rarity === 'rare' ?
          'rare-bg' : 'common-bg';
        return `<span class="result-card-line ${bg}" style="animation-delay:${i*0.05}s">${r.icon}${r.name}</span>`;
      }).join(' ');
      h += '</div>';
      if (results.length > 12) h += `<p>외 ${results.length - 12}장</p>`;
      c.innerHTML = h;
      if (leg.length > 0) showModal('🎉 대박! 전설 카드 획득!\n' + leg.map(r => r.icon + r.name).join(', '));
    }

    function evolveCard(cardId) {
      const card = CARD_DB.find(c => c.id === cardId);
      if (!card || !ownedCards[cardId]) return;
      const cost = 30 * ownedCards[cardId].level;
      if (dust < cost) { showModal('⭐ 진화의 돌 부족! 필요: ' + cost); return; }
      dust -= cost;
      ownedCards[cardId].level++;
      updateAllUI();
      saveGame();
      const s = getCardStats(cardId);
      spawnSparks(window.innerWidth / 2, window.innerHeight / 2, 20);
      showModal(`🆙 ${card.icon} ${card.name} Lv.${ownedCards[cardId].level}!\nHP: ${s.hp} ATK: ${s.atk}`);
    }

    function toggleDeck(cardId) {
      if (deck.includes(cardId)) { deck = deck.filter(id => id !== cardId); } else { if (deck.length >= 5) { showModal(
          '⚠️ 덱은 최대 5장!'); return; }
        if (!ownedCards[cardId] || ownedCards[cardId].count <= 0) return;
        deck.push(cardId); }
      updateAllUI();
      saveGame();
    }

    function getDeckPower() { return deck.reduce((s, id) => { const st = getCardStats(id); return s + st.hp + st.atk *
        2; }, 0); }

    function buyShop(item) {
      switch (item) {
        case 'gems300':
          gems += 300;
          break;
        case 'tickets3':
          if (gold < 500) { showModal('💰 골드 부족!'); return; }
          gold -= 500;
          tickets += 3;
          break;
        case 'dust30':
          if (gold < 300) { showModal('💰 골드 부족!'); return; }
          gold -= 300;
          dust += 30;
          break;
        case 'gold1000':
          if (gems < 100) { showModal('💎 다이아 부족!'); return; }
          gems -= 100;
          gold += 1000;
          break;
      }
      updateAllUI();
      saveGame();
      showModal('✅ 구매 완료!');
    }

    function initQuests() {
      quests = [
        { id: 'q1', name: '카드 10장 수집', goal: 10, reward: { gems: 100 }, claimed: false, progress: 0 },
        { id: 'q2', name: '카드 50장 수집', goal: 50, reward: { tickets: 5 }, claimed: false, progress: 0 },
        { id: 'q3', name: '레어 이상 카드 3장', goal: 3, reward: { dust: 50 }, claimed: false, progress: 0 },
        { id: 'q4', name: '에픽 이상 카드 1장', goal: 1, reward: { gems: 300 }, claimed: false, progress: 0 },
      ];
    }

    function updateQuests() {
      const rareCount = Object.entries(ownedCards).filter(([id]) => {
        const c = CARD_DB.find(cd => cd.id === id);
        return c && ['rare', 'epic', 'legendary'].includes(c.rarity);
      }).length;
      const epicCount = Object.entries(ownedCards).filter(([id]) => {
        const c = CARD_DB.find(cd => cd.id === id);
        return c && ['epic', 'legendary'].includes(c.rarity);
      }).length;
      quests.forEach(q => {
        if (q.id === 'q1' || q.id === 'q2') q.progress = Math.min(cardsOpened, q.goal);
        if (q.id === 'q3') q.progress = Math.min(rareCount, q.goal);
        if (q.id === 'q4') q.progress = Math.min(epicCount, q.goal);
      });
    }

    function claimQuest(questId) {
      const q = quests.find(q => q.id === questId);
      if (!q || q.claimed || q.progress < q.goal) { showModal('📋 완료되지 않음!'); return; }
      q.claimed = true;
      if (q.reward.gems) gems += q.reward.gems;
      if (q.reward.tickets) tickets += q.reward.tickets;
      if (q.reward.dust) dust += q.reward.dust;
      spawnSparks(window.innerWidth / 2, window.innerHeight / 2, 15);
      updateAllUI();
      saveGame();
      showModal('🎁 보상 획득!');
    }

    function updateAllUI() {
      document.getElementById('gemDisplay').textContent = gems.toLocaleString();
      document.getElementById('goldDisplay').textContent = gold.toLocaleString();
      document.getElementById('dustDisplay').textContent = dust.toLocaleString();
      document.getElementById('ticketDisplay').textContent = tickets;
      document.getElementById('pityCounter').textContent = pityCount;
      updateCollectionUI();
      updateDeckUI();
      updateQuestUI();
    }

    function updateCollectionUI() {
      const grid = document.getElementById('collectionGrid');
      let entries = Object.entries(ownedCards);
      if (currentFilter !== 'all') entries = entries.filter(([id]) => { const c = CARD_DB.find(cd => cd.id === id); return c &&
          c.rarity === currentFilter; });
      if (entries.length === 0) { grid.innerHTML =
          '<p style="color:#aaa;text-align:center;padding:20px;">보유한 카드가 없습니다</p>'; return; }
      grid.innerHTML = entries.map(([id, data]) => {
        const card = CARD_DB.find(c => c.id === id);
        if (!card) return '';
        const stats = getCardStats(id);
        const inDeck = deck.includes(id);
        return `
          <div class="card-item ${card.rarity==='legendary'?'legendary':''}" onclick="toggleDeck('${id}')" style="${inDeck?'border-color:#0f0;box-shadow:0 0 15px #0f0;':''}">
            <div class="card-count">x${data.count}</div>
            <div class="icon" style="font-size:3rem;">${card.img||card.icon}</div>
            <div class="name">${card.name}</div>
            <div class="rarity rarity-${card.rarity}">${card.rarity.toUpperCase()}</div>
            <div class="level">Lv.${stats.level} ❤️${stats.hp} ⚔️${stats.atk}</div>
            <button style="margin-top:4px;padding:3px 8px;font-size:0.65rem;background:#c9a44b;border:none;border-radius:10px;cursor:pointer;color:#000;z-index:2;position:relative;" 
                    onclick="event.stopPropagation();evolveCard('${id}')">진화</button>
            ${inDeck?'<div style="color:#0f0;font-size:0.6rem;">✅ 덱</div>':''}
          </div>`;
      }).join('');
    }

    function updateDeckUI() {
      const slots = document.getElementById('deckSlots');
      let html = '';
      for (let i = 0; i < 5; i++) {
        if (i < deck.length) {
          const card = CARD_DB.find(c => c.id === deck[i]);
          const stats = getCardStats(deck[i]);
          html +=
            `<div class="deck-slot filled" onclick="toggleDeck('${deck[i]}')"><div>${card?.img||card?.icon||''}<br><small>${card?.name||''}</small><br><small>Lv.${stats.level}</small></div></div>`;
        } else { html += '<div class="deck-slot">빈 슬롯</div>'; }
      }
      slots.innerHTML = html;
      document.getElementById('deckPower').textContent = getDeckPower();
    }

    function updateQuestUI() {
      document.getElementById('questList').innerHTML = quests.map(q => `
        <div class="quest-item">
          <div style="flex:1;min-width:150px;">
            <strong>${q.name}</strong>
            <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100,q.progress/q.goal*100)}%"></div></div>
            <small>${Math.min(q.progress,q.goal)}/${q.goal} | 보상: ${q.reward.gems?'💎'+q.reward.gems:''}${q.reward.tickets?'🎫'+q.reward.tickets:''}${q.reward.dust?'⭐'+q.reward.dust:''}</small>
          </div>
          <button ${q.claimed||q.progress<q.goal?'disabled':''} onclick="claimQuest('${q.id}')">${q.claimed?'완료':'받기'}</button>
        </div>`).join('');
    }

    function saveGame() {
      localStorage.setItem('cardMasterSave2', JSON.stringify({ gems, gold, dust, tickets, pityCount, ownedCards, deck,
        cardsOpened, quests }));
    }

    function loadGame() {
      const s = localStorage.getItem('cardMasterSave2');
      if (s) {
        try {
          const d = JSON.parse(s);
          gems = d.gems ?? 500;
          gold = d.gold ?? 1000;
          dust = d.dust ?? 50;
          tickets = d.tickets ?? 0;
          pityCount = d.pityCount ?? 0;
          ownedCards = d.ownedCards ?? {};
          deck = d.deck ?? [];
          cardsOpened = d.cardsOpened ?? 0;
          quests = d.quests ?? [];
          if (quests.length === 0) initQuests();
          else updateQuests();
        } catch (e) { initQuests(); }
      } else { initQuests(); }
    }

    document.getElementById('pullOne').addEventListener('click', () => pullGacha(1));
    document.getElementById('pullTen').addEventListener('click', () => pullGacha(10));
    document.getElementById('btnGems300').addEventListener('click', () => buyShop('gems300'));
    document.getElementById('btnTickets3').addEventListener('click', () => buyShop('tickets3'));
    document.getElementById('btnDust30').addEventListener('click', () => buyShop('dust30'));
    document.getElementById('btnGold1000').addEventListener('click', () => buyShop('gold1000'));

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', function() {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-' + this.dataset.tab).classList.add('active');
        if (this.dataset.tab === 'collection') updateCollectionUI();
      });
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = this.dataset.filter;
        updateCollectionUI();
      });
    });

    window.toggleDeck = toggleDeck;
    window.evolveCard = evolveCard;
    window.claimQuest = claimQuest;

    loadGame();
    addCard('c01', 1);
    addCard('c02', 1);
    addCard('c03', 1);
    updateQuests();
    updateAllUI();
    console.log('🌟 스타 카드 마스터 - 홀로그램 가챠 준비 완료!');
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 스타 커맨더 - 3D 우주 슈팅</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #000;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }
    #gameCanvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }
    #uiLayer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      pointer-events: none;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 10;
    }
    .hud-panel {
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 255, 255, 0.3);
      border-radius: 16px;
      padding: 16px 22px;
      color: #0ff;
      font-weight: bold;
      box-shadow: 0 0 30px rgba(0, 255, 255, 0.15);
    }
    .score-display {
      font-size: 2rem;
      text-shadow: 0 0 20px #0ff;
    }
    .health-bar {
      width: 200px;
      height: 12px;
      background: rgba(255,255,255,0.1);
      border-radius: 20px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid #0ff;
    }
    .health-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff0044, #ff4466);
      transition: width 0.3s;
      box-shadow: 0 0 15px #f44;
    }
    .controls-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 0.85rem;
      pointer-events: none;
      z-index: 10;
    }
    #gameOverScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
      pointer-events: all;
    }
    #gameOverScreen.active {
      display: flex;
    }
    .gameover-box {
      text-align: center;
      color: white;
    }
    .gameover-box h1 {
      font-size: 4rem;
      color: #ff4444;
      text-shadow: 0 0 50px #f00;
    }
    .restart-btn {
      background: #0ff;
      color: #000;
      border: none;
      padding: 16px 40px;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 20px;
      pointer-events: all;
    }
  </style>
</head>
<body>
  <div id="uiLayer">
    <div class="hud-panel">
      <div class="score-display" id="scoreDisplay">0</div>
      <div style="color:#aaa; font-size:0.8rem;">KILLS</div>
      <div class="health-bar">
        <div class="health-fill" id="healthFill" style="width:100%"></div>
      </div>
    </div>
    <div class="hud-panel" style="text-align:right;">
      <div style="color:#ff0; font-size:1.2rem;">⭐ <span id="comboDisplay">x1</span></div>
      <div style="color:#aaa; font-size:0.7rem;">COMBO</div>
    </div>
  </div>
  <div id="gameOverScreen">
    <div class="gameover-box">
      <h1>💥 GAME OVER</h1>
      <p style="font-size:1.5rem; color:#0ff;">최종 점수: <span id="finalScore">0</span></p>
      <button class="restart-btn" id="restartButton">🚀 다시 출격</button>
    </div>
  </div>
  <div class="controls-hint">🖱️ 마우스 이동 / 터치 드래그 | 🖱️ 클릭/터치: 레이저 발사</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';

    // ==================== 게임 엔진 ====================
    class StarCommander {
      constructor() {
        this.score = 0;
        this.combo = 1;
        this.comboTimer = 0;
        this.health = 100;
        this.isGameOver = false;
        this.mouseX = 0;
        this.mouseY = 0;
        this.isFiring = false;
        this.fireCooldown = 0;
        
        // 오브젝트 풀
        this.bullets = [];
        this.enemies = [];
        this.particles = [];
        this.stars = [];
        this.powerUps = [];
        
        // Three.js 설정
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.5, 200);
        this.camera.position.z = 25;
        this.camera.position.y = 3;
        
        this.renderer = new THREE.WebGLRenderer({ 
          antialias: true, 
          alpha: false,
          powerPreference: "high-performance"
        });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.toneMapping = THREE.RecombinantToneMapping;
        document.body.prepend(this.renderer.domElement);
        
        // 포스트 프로세싱
        this.composer = new EffectComposer(this.renderer);
        this.composer.addPass(new RenderPass(this.scene, this.camera));
        
        const bloomPass = new UnrealBloomPass(
          new THREE.Vector2(window.innerWidth, window.innerHeight), 
          1.2, 0.4, 0.85
        );
        this.composer.addPass(bloomPass);
        
        const rgbShift = new ShaderPass(RGBShiftShader);
        rgbShift.uniforms.amount.value = 0.002;
        this.composer.addPass(rgbShift);
        rgbShift.renderToScreen = true;
        
        this.initScene();
        this.initPlayer();
        this.initLights();
        this.initAudio();
        this.bindEvents();
        this.animate();
      }
      
      initScene() {
        // 성운 배경
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 2000;
        const starsPos = new Float32Array(starsCount * 3);
        const starsColors = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount; i++) {
          starsPos[i*3] = (Math.random() - 0.5) * 120;
          starsPos[i*3+1] = (Math.random() - 0.5) * 80;
          starsPos[i*3+2] = -10 - Math.random() * 60;
          starsColors[i*3] = 0.5 + Math.random() * 0.5;
          starsColors[i*3+1] = 0.5 + Math.random() * 0.5;
          starsColors[i*3+2] = 0.8 + Math.random() * 0.2;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starsPos, 3));
        starsGeo.setAttribute('color', new THREE.BufferAttribute(starsColors, 3));
        const starsMat = new THREE.PointsMaterial({ 
          size: 0.15, 
          vertexColors: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false
        });
        this.starField = new THREE.Points(starsGeo, starsMat);
        this.scene.add(this.starField);
        
        // 행성
        const planetGeo = new THREE.SphereGeometry(8, 64, 64);
        const planetMat = new THREE.MeshStandardMaterial({
          color: 0x2244aa,
          roughness: 0.7,
          metalness: 0.2
        });
        this.planet = new THREE.Mesh(planetGeo, planetMat);
        this.planet.position.set(30, -25, -50);
        this.scene.add(this.planet);
        
        const ringGeo = new THREE.TorusGeometry(12, 1.5, 16, 100);
        const ringMat = new THREE.MeshStandardMaterial({
          color: 0x88aaff,
          roughness: 0.4,
          metalness: 0.6,
          emissive: 0x224466
        });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 3;
        this.planet.add(ring);
      }
      
      initPlayer() {
        // 우주선 모델
        const shipGroup = new THREE.Group();
        
        const bodyGeo = new THREE.ConeGeometry(0.6, 2.5, 8, 1);
        const bodyMat = new THREE.MeshStandardMaterial({ 
          color: 0x3366cc, 
          roughness: 0.2, 
          metalness: 0.9,
          emissive: 0x112244
        });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.rotation.x = Math.PI / 2;
        shipGroup.add(body);
        
        const wingGeo = new THREE.BoxGeometry(2.2, 0.15, 0.8);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0x2255aa, roughness: 0.3, metalness: 0.8 });
        const wings = new THREE.Mesh(wingGeo, wingMat);
        wings.position.z = -0.3;
        shipGroup.add(wings);
        
        const engineGeo = new THREE.CylinderGeometry(0.2, 0.4, 0.8, 8);
        const engineMat = new THREE.MeshStandardMaterial({ 
          color: 0xff4400, 
          roughness: 0.1, 
          emissive: 0xff2200,
          emissiveIntensity: 2
        });
        this.engineGlow = new THREE.Mesh(engineGeo, engineMat);
        this.engineGlow.position.z = 1.3;
        shipGroup.add(this.engineGlow);
        
        this.player = shipGroup;
        this.player.position.set(0, -3, 0);
        this.scene.add(this.player);
        
        // 쉴드 이펙트
        const shieldGeo = new THREE.SphereGeometry(1.6, 32, 32);
        const shieldMat = new THREE.MeshBasicMaterial({ 
          color: 0x44aaff, 
          transparent: true, 
          opacity: 0.15,
          wireframe: true 
        });
        this.shield = new THREE.Mesh(shieldGeo, shieldMat);
        this.player.add(this.shield);
      }
      
      initLights() {
        const ambient = new THREE.AmbientLight(0x334466, 1.5);
        this.scene.add(ambient);
        const sunLight = new THREE.DirectionalLight(0xffffff, 3);
        sunLight.position.set(10, 20, 5);
        this.scene.add(sunLight);
        const pointLight = new THREE.PointLight(0xff4400, 20, 15);
        pointLight.position.z = 2;
        this.player.add(pointLight);
      }
      
      initAudio() {
        this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        this.sfxVolume = 0.3;
      }
      
      playSound(freq, duration, type = 'square') {
        if (!this.audioCtx) return;
        const osc = this.audioCtx.createOscillator();
        const gain = this.audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, this.audioCtx.currentTime);
        gain.gain.setValueAtTime(this.sfxVolume, this.audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(this.audioCtx.destination);
        osc.start();
        osc.stop(this.audioCtx.currentTime + duration);
      }
      
      shoot() {
        if (this.fireCooldown > 0 || this.isGameOver) return;
        this.fireCooldown = 4;
        
        const bulletGeo = new THREE.SphereGeometry(0.15, 8, 8);
        const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const bullet = new THREE.Mesh(bulletGeo, bulletMat);
        bullet.position.copy(this.player.position);
        bullet.position.z += 0.8;
        bullet.userData = { velocity: 0.8, life: 60 };
        this.scene.add(bullet);
        this.bullets.push(bullet);
        
        // 총구 섬광
        this.createMuzzleFlash();
        this.playSound(800, 0.08, 'square');
      }
      
      createMuzzleFlash() {
        const flashGeo = new THREE.SphereGeometry(0.3, 8, 8);
        const flashMat = new THREE.MeshBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 1 });
        const flash = new THREE.Mesh(flashGeo, flashMat);
        flash.position.copy(this.player.position);
        flash.position.z += 1;
        flash.userData = { life: 8, type: 'flash' };
        this.scene.add(flash);
        this.particles.push(flash);
      }
      
      spawnEnemy() {
        if (this.isGameOver) return;
        const types = [
          { geo: new THREE.IcosahedronGeometry(0.7, 1), color: 0xff3344, health: 2, speed: 0.2, points: 100 },
          { geo: new THREE.OctahedronGeometry(0.8, 0), color: 0xff8800, health: 3, speed: 0.15, points: 200 },
          { geo: new THREE.DodecahedronGeometry(0.6, 0), color: 0xff00ff, health: 5, speed: 0.12, points: 500 }
        ];
        const type = types[Math.floor(Math.random() * types.length)];
        const enemy = new THREE.Mesh(type.geo, new THREE.MeshStandardMaterial({ 
          color: type.color, 
          roughness: 0.3, 
          metalness: 0.5,
          emissive: type.color,
          emissiveIntensity: 0.5
        }));
        enemy.position.set(
          (Math.random() - 0.5) * 30,
          (Math.random() - 0.5) * 20 + 3,
          -20 - Math.random() * 20
        );
        enemy.userData = {
          health: type.health,
          maxHealth: type.health,
          speed: type.speed,
          points: type.points,
          type: 'enemy',
          wobble: Math.random() * Math.PI * 2
        };
        this.scene.add(enemy);
        this.enemies.push(enemy);
      }
      
      createExplosion(position, color = 0xff4400) {
        for (let i = 0; i < 20; i++) {
          const particleGeo = new THREE.SphereGeometry(0.08, 4, 4);
          const particleMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
          const particle = new THREE.Mesh(particleGeo, particleMat);
          particle.position.copy(position);
          particle.userData = {
            velocity: new THREE.Vector3(
              (Math.random() - 0.5) * 0.6,
              (Math.random() - 0.5) * 0.6,
              (Math.random() - 0.5) * 0.6
            ),
            life: 25 + Math.random() * 15,
            type: 'particle'
          };
          this.scene.add(particle);
          this.particles.push(particle);
        }
        this.playSound(120, 0.2, 'sawtooth');
      }
      
      damagePlayer(amount) {
        if (this.isGameOver) return;
        this.health -= amount;
        document.getElementById('healthFill').style.width = Math.max(0, this.health) + '%';
        this.shield.material.opacity = 0.5;
        setTimeout(() => { if (this.shield) this.shield.material.opacity = 0.15; }, 200);
        
        if (this.health <= 0) {
          this.gameOver();
        }
      }
      
      gameOver() {
        this.isGameOver = true;
        document.getElementById('finalScore').textContent = this.score;
        document.getElementById('gameOverScreen').classList.add('active');
        this.createExplosion(this.player.position, 0xff0000);
        this.player.visible = false;
        this.playSound(60, 0.5, 'sawtooth');
      }
      
      restart() {
        this.score = 0;
        this.combo = 1;
        this.health = 100;
        this.isGameOver = false;
        this.player.visible = true;
        this.player.position.set(0, -3, 0);
        document.getElementById('healthFill').style.width = '100%';
        document.getElementById('scoreDisplay').textContent = '0';
        document.getElementById('comboDisplay').textContent = 'x1';
        document.getElementById('gameOverScreen').classList.remove('active');
        
        // 클린업
        [...this.enemies, ...this.bullets, ...this.particles].forEach(obj => {
          this.scene.remove(obj);
          if (obj.geometry) obj.geometry.dispose();
          if (obj.material) obj.material.dispose();
        });
        this.enemies = [];
        this.bullets = [];
        this.particles = [];
      }
      
      update() {
        if (this.isGameOver) {
          this.starField.position.z += 0.1;
          return;
        }
        
        // 플레이어 이동
        const targetX = this.mouseX * 14;
        const targetY = this.mouseY * 9 - 3;
        this.player.position.x += (targetX - this.player.position.x) * 0.12;
        this.player.position.y += (targetY - this.player.position.y) * 0.12;
        this.player.rotation.z = (targetX - this.player.position.x) * 0.5;
        this.player.rotation.x = (targetY - this.player.position.y) * 0.3;
        
        // 엔진 글로우
        this.engineGlow.material.emissiveIntensity = 1.5 + Math.sin(Date.now() * 0.02) * 0.8;
        
        // 발사
        if (this.isFiring) this.shoot();
        this.fireCooldown = Math.max(0, this.fireCooldown - 1);
        
        // 총알 업데이트
        for (let i = this.bullets.length - 1; i >= 0; i--) {
          const bullet = this.bullets[i];
          bullet.position.z += bullet.userData.velocity;
          bullet.userData.life--;
          if (bullet.userData.life <= 0 || bullet.position.z > 10) {
            this.scene.remove(bullet);
            bullet.geometry.dispose();
            bullet.material.dispose();
            this.bullets.splice(i, 1);
          }
        }
        
        // 적 업데이트
        for (let i = this.enemies.length - 1; i >= 0; i--) {
          const enemy = this.enemies[i];
          enemy.position.z += enemy.userData.speed;
          enemy.position.x += Math.sin(enemy.userData.wobble + Date.now() * 0.003) * 0.03;
          enemy.rotation.x += 0.02;
          enemy.rotation.y += 0.03;
          
          // 충돌 체크
          for (let j = this.bullets.length - 1; j >= 0; j--) {
            const bullet = this.bullets[j];
            if (bullet.position.distanceTo(enemy.position) < 1.2) {
              enemy.userData.health--;
              this.scene.remove(bullet);
              bullet.geometry.dispose();
              bullet.material.dispose();
              this.bullets.splice(j, 1);
              
              if (enemy.userData.health <= 0) {
                this.createExplosion(enemy.position);
                this.score += enemy.userData.points * this.combo;
                this.combo = Math.min(10, this.combo + 1);
                this.comboTimer = 90;
                document.getElementById('scoreDisplay').textContent = this.score;
                document.getElementById('comboDisplay').textContent = 'x' + this.combo;
                this.scene.remove(enemy);
                enemy.geometry.dispose();
                enemy.material.dispose();
                this.enemies.splice(i, 1);
                this.playSound(400, 0.1, 'triangle');
              }
              break;
            }
          }
          
          // 화면 밖으로 나가거나 플레이어 충돌
          if (enemy && enemy.position.z > 5) {
            this.scene.remove(enemy);
            enemy.geometry.dispose();
            enemy.material.dispose();
            this.enemies.splice(i, 1);
            this.damagePlayer(15);
            this.combo = 1;
          }
        }
        
        // 파티클 업데이트
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.userData.life--;
          if (p.userData.velocity) p.position.add(p.userData.velocity);
          if (p.material.opacity !== undefined) p.material.opacity = p.userData.life / 30;
          p.scale.multiplyScalar(0.97);
          if (p.userData.life <= 0) {
            this.scene.remove(p);
            p.geometry.dispose();
            p.material.dispose();
            this.particles.splice(i, 1);
          }
        }
        
        // 콤보 타이머
        if (this.comboTimer > 0) {
          this.comboTimer--;
          if (this.comboTimer === 0) this.combo = 1;
        }
        
        // 적 생성
        if (Math.random() < 0.025 + this.score * 0.0001) {
          this.spawnEnemy();
        }
        
        // 배경 이동
        this.starField.position.z += 0.15;
        if (this.starField.position.z > 5) this.starField.position.z -= 10;
      }
      
      animate() {
        requestAnimationFrame(() => this.animate());
        this.update();
        this.composer.render();
      }
      
      bindEvents() {
        const canvas = this.renderer.domElement;
        
        canvas.addEventListener('mousemove', (e) => {
          this.mouseX = (e.clientX / window.innerWidth) * 2 - 1;
          this.mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
        });
        
        canvas.addEventListener('touchmove', (e) => {
          e.preventDefault();
          this.mouseX = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
          this.mouseY = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
          this.isFiring = true;
        }, { passive: false });
        
        canvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          this.isFiring = true;
          if (this.audioCtx?.state === 'suspended') this.audioCtx.resume();
        });
        
        canvas.addEventListener('touchend', () => this.isFiring = false);
        canvas.addEventListener('mousedown', () => {
          this.isFiring = true;
          if (this.audioCtx?.state === 'suspended') this.audioCtx.resume();
        });
        canvas.addEventListener('mouseup', () => this.isFiring = false);
        
        window.addEventListener('resize', () => {
          this.camera.aspect = window.innerWidth / window.innerHeight;
          this.camera.updateProjectionMatrix();
          this.renderer.setSize(window.innerWidth, window.innerHeight);
          this.composer.setSize(window.innerWidth, window.innerHeight);
        });
        
        document.getElementById('restartButton').addEventListener('click', () => this.restart());
      }
    }
    
    // 게임 시작
    const game = new StarCommander();
    console.log('🚀 스타 커맨더 준비 완료!');
  </script>
</body>
</html>
